comparison: >-
  C1 충족 — 비용 단조 증가, 단 이번엔 기저전력만이 아니라 조립 작업 자체가
  피크대로 이동(피크대 kWh 120→447): q180 대비 증가폭 4배(+609,606 VND at 22:30).
  C2 위배 — 전체 makespan의 한계 앞당김이 첫 증분 −0.8분, 마지막 증분 0분으로
  체감 구조 불성립(실질 이득 0). 관찰된 실제 구조: 저녁 백로그는 실재했고
  (q180과 달리 저녁 조립이 실제 발생), 모델별 완료는 크게 앞당겨짐 —
  MODEL_C −15.4h(19시 연장만으로 day1 오전→day0 저녁, 이후 포화),
  MODEL_A −3.4~−6.1h(연장할수록 점증), MODEL_B 불변(본드 경화 24h 임계경로).
  즉 PO 전체 완료 기준 이득은 B가 믹스에 있는 한 0이고, 모델별 출하 가능
  시점 기준으로는 실질 이득이 존재 — "이득"의 정의(전체 vs 모델별)가 결론을
  가른다.

verdict:      fails
