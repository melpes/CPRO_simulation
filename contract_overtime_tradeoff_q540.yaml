id:           OT-TRADEOFF-q540-earliness-vs-toucost
status:       completed
registered_at: "2026-07-19"
claim_type:   existence
topic:        초과근무 손익분기
goal: >-
  q180에서 이득 0으로 퇴화했던(OT-TRADEOFF-earliness-vs-toucost, fails) 트레이드오프
  구조가, 저녁까지 일감이 남는 주문 규모(q540 = A180/B180/C180)에서는 나타나는가 —
  초과근무 연장 시 완료 앞당김(이득)은 체감하고 TOU 전기비용(비용)은 계속 증가하는
  무릎 구조의 존재 검증.
criterion:
  - "C1(비용 단조증가): TOU 가중 전기비용(VND, seed 평균)이 종료시각 인접 레벨 전 구간(18→19→20→21→22.5)에서 단조 증가한다"
  - "C2(이득 체감): 시간당 한계 앞당김(레벨 간 Δmakespan ÷ Δ연장시간, seed 평균)이 첫 증분(18→19) 대비 마지막 증분(21→22.5)에서 더 작다"
assumptions:
  - "이득은 '완료 앞당김(일)'로 정의 — baseline(18:00 종료) 대비 makespan 감소. 화폐가치 환산은 범위 밖"
  - "시뮬은 요일 미구분 → 전 일자 평일(피크 있음) 가정 — 일요일 무피크 효과 미반영"
  - "정책은 18:00 종료 조건에서 학습된 고정 정책(q540 검증 이력이 있는 q540val 체크포인트) — 연장 조건 재학습 없음"
  - "요율 6~22kV 사용 — 피크/보통 비율(≈1.8)은 전압등급 불변이므로 무릎 위치 결론은 등급 무관"
  - "q180 대비 변경은 주문 수량(60→180/모델)·납기(3→6일)·에피소드 상한(250,000→864,000초)뿐 — 나머지 조건 동일"

setup:
  sim: "KG/keti/CPRO_조립공정/시뮬레이션/Package (현행 코드, AAS: 에이징3h·공장기저10kW)"
  scenario: "schedule (PO 완주)"
  po: "MODEL_A 180 / MODEL_B 180 / MODEL_C 180, due_day 6, MaxEpisodeSec 864000(10일)"
  tariff: "결정 1279/QĐ-BCT 6~22kV: 보통 1,899 / 피크 3,508 / 심야 1,234 VND/kWh (VAT 제외)"
  timebands: "결정 963/QĐ-BCT: 피크 17:30~22:30, 심야 00~06, 나머지 보통"
  energy_attribution: "기저=근무창 10kW, 조립=이벤트 구간 정격전력 균등, SMT=배치 실적립 kWh 균등 — 3계정 시뮬 집계 일치 15/15 재검증"

reference:
  kind: node
  ref: "self-baseline (work_end_hour=18.0 레벨이 스윕 내 기준선)"

factors:
  - {name: work_end_hour, role: test,    levels: [18.0, 19.0, 20.0, 21.0, 22.5]}
  - {name: po,            role: control, value: "A180/B180/C180 due6"}
  - {name: policy_ckpt,   role: control, value: "result/runs/q180s__q540val-300ep/agent_mod.pt (고정)"}
  - {name: tariff_tier,   role: control, value: "6~22kV"}
  - {name: work_start,    role: control, value: "09:00 (점심 12~13시 고정)"}
  - {name: max_episode,   role: control, value: "864000초(10일) — 기본 250,000초로는 q540 완주 불가 가능"}
  - {name: seed,          role: random,  distribution: "seeds 0-2", n: 3}

determinism:  stochastic
method: >-
  exp_overtime/overtime_tou_driver.py --qty 180 --due 6 --maxsec 864000 —
  각 (종료시각, seed) 1회 완주. makespan·모델별 완료시각·TOU 대역별 kWh·VND 비용.
  레벨별 seed 평균 + bootstrap CI(stats.py), 한계 앞당김은 인접 레벨 차분.
