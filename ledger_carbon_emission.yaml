mode: review
entries:
  - id: L-standards-hierarchy
    kind: literature
    t: 2026-07-16
    by: CC
    status: relevant
    source:
      title: "GHG Protocol Scope 3 Ch.4 + GLEC Framework v2/v3.2 + ISO 14083 — 운송 배출 산정법 위계"
      authors: "GHG Protocol / Smart Freight Centre / ISO"
      year: 2025
      venue: "표준 원문 PDF (ghgprotocol.org, smartfreightcentre.org)"
      url: "https://smart-freight-centre-media.s3.amazonaws.com/documents/GLEC_FRAMEWORK_v3.2_21_10_25_1.pdf"
    claim: >-
      세 표준이 공통 위계를 규정 — 연료 기반(실측 연료량×연료계수) 최우선,
      거리 기반 차선, 기본값(default)/지출 기반은 최후 수단. GHG Protocol 원문:
      "연료 소비가 배출과 직접 연관되므로 연료 기반이 거리 기반보다 정확".
      GLEC은 ISO 14083:2023의 방법론적 모체. ISO 14083은 TTW(탱크-투-휠,
      배기관 직접)와 WTW(웰-투-휠, 연료 생산 포함) 병기 보고를 요구하며 계산은
      "에너지 소비량 × 연료 배출계수" 상향식.
    relevance: >-
      ③ 물류 시나리오 배출 산정의 뼈대. 시뮬레이션에서는 주유량 실측이 없으므로
      거리 기반이 현실 선택지이고, 보고 산출물엔 TTW/WTW 두 값을 병기해야
      표준 부합.
    takeaway: "deep-research 3표 검증 — 병합 7건 전부 3-0, 원문 PDF 직접 대조."

  - id: L-diesel-ef
    kind: literature
    t: 2026-07-16
    by: CC
    status: relevant
    source:
      title: "경유 배출계수 — GLEC v2/v3.2, EcoTransIT v4/2024, 인도 SFC, NTM, IPCC"
      authors: "Smart Freight Centre / EcoTransIT / NTM"
      year: 2025
      venue: "표준 원문 PDF 4종 교차"
      url: "https://www.ecotransit.org/wp-content/uploads/EcoTransIT_World_Methodology_Report_Version_4_ISO14083.pdf"
    claim: >-
      TTW(직접 배출): 2.67~2.68 kgCO2e/L — 4개 독립 1차 문서가 ±0.4% 이내 수렴
      (IPCC 74,100 kgCO2/TJ 기본값과 일치). WTW: 3.2(NTM 보수 하한)~3.48
      (GLEC v3.2·EcoTransIT, ecoinvent 3.9.1) kgCO2e/L. WTW/TTW 비율은 구판
      1.20 → 현행 v3.2에서 1.30으로 상향(메탄 누출 데이터 갱신).
    relevance: >-
      연료→배출 환산의 고정 상수. TTW 2.68 kgCO2e/L은 어느 표준으로도 방어 가능,
      WTW는 최신 기준 3.48 사용(보수 하한 3.2). 국가 기준 아님 — 연소 화학 상수
      (IPCC 글로벌 기본값 계열)라 국가 불문 동일. 리터당으로 달라질 수 있는 유일한
      실질 요인은 바이오디젤 혼합(O-biodiesel-sulfur).
    takeaway: >-
      원문 검증 위치(리터당 값은 문서에 직접 없고 곱셈으로 도출): ① EcoTransIT
      Methodology v4 — Table 14 연료 물성(밀도 0.832 kg/L, 발열량 42.8 MJ/kg),
      Table 54 연료계수(operational 75.26 / total 97.8 gCO2e/MJ) → 75.26×35.61
      MJ/L=2,680 g/L. ② GLEC v3.2 — p.77 유럽 연료표 3.22 kgCO2e/kg × 0.83
      kg/L=2.67. ③ 인도 SFC v1.2 — 리터당 직접 표기(TTW 2.675 + WTT 0.8058),
      IPCC 기본값(74,100 kgCO2/TJ, NCV 43 TJ/Gg)에서 도출 명시. ④ NTM TN-13
      웹페이지 — "international diesel 3.2 kg CO2e/L" 축자. IPCC 원 위치는
      2006 가이드라인 Vol.2(에너지) Ch.3(이동연소) 도로수송 표(74,100)·Vol.2
      Ch.1 발열량 표(43.0 TJ/Gg)로 추정 — 표 번호는 내 지식 기반, 원문 재확인
      권장. 페이지·표 번호는 검증 에이전트의 원문 대조 기록이라 판본에 따라
      밀릴 수 있음 — 표 제목으로 찾는 것이 안전.
    caveat: >-
      GLEC v2의 리터당 값(3.24) claim은 2-1 표결. NTM의 WTT 성분 산출 근거 서술
      claim은 0-3 기각 — NTM 3.2 헤드라인 값만 생존. 인용 시 v3.2 값 기준 권장.

  - id: L-glec-vehicle-defaults
    kind: literature
    t: 2026-07-16
    by: CC
    status: relevant
    source:
      title: "GLEC Framework v3.2 차량 등급별 tonne-km 기본값 + 아시아 지역 할증"
      authors: "Smart Freight Centre (HBEFA 파생, 아시아 할증은 NTM/ICCT 실주행 데이터 외삽)"
      year: 2025
      venue: "GLEC v3.2 (2025-10-21 현행판)"
      url: "https://smart-freight-centre-media.s3.amazonaws.com/documents/GLEC_FRAMEWORK_v3.2_21_10_25_1.pdf"
    claim: >-
      유럽 기본값(WTW, gCO2e/t-km): 밴(<3.5t) 840 / 도시트럭(3.5~7.5t) 335 /
      중형(7.5~20t) 210 / 대형(>20t) 125 — 대형일수록 t-km당 약 7배 유리(규모의
      경제). 적재율 60%·공차운행 17% 가정, +5% 우회거리 보정 내장. 베트남 포함
      아시아(중국·인도 제외)는 국가표 없음 — 밴 +13%, 3.5t 초과 +22% 할증 적용
      지시(v3.2 p.105 축자 확인, 'Vietnam' 전문 검색 0회). 아시아 적용값(산술):
      밴 949 / 3.5~7.5t 409 / 7.5~20t 256 / >20t 152.5 gCO2e/t-km(WTW).
    relevance: >-
      t-km 지표가 필요할 때(원단위 보고·차급 비교) 쓸 유일한 GLEC 공식 지역값.
      구판 v2 수치(680/370/200/92)는 이력 참조로만 — 신규 산정은 v3.2.
    caveat: "아시아 적용값 4개는 할증률 산술 적용(내 계산) — 표에 직접 실린 수치 아님."

  - id: L-ecotransit-fuel-defaults
    kind: literature
    t: 2026-07-16
    by: CC
    status: relevant
    source:
      title: "EcoTransIT World (ISO 14083 부합 도구) 차급별 에너지 소비 기본값"
      authors: "EcoTransIT (HBEFA 4.2 출처)"
      year: 2024
      venue: "Methodology Report v4 + 2024 Update, Table 23~25/35~36"
      url: "https://www.ecotransit.org/wp-content/uploads/20240308_Methodology_Report_Update_2024.pdf"
    claim: >-
      Euro VI 트럭 TTW 에너지(MJ/km, 공차/60%적재/만차): 3.5~7.5t 5.8/6.4/6.8,
      7.5~12t 6.3/7.1/7.6, 12~20t 7.0/8.5/9.5, 20~26t 7.8/9.8/11.2,
      26~40t 8.4/11.9/14.4. 예: 12~20t 60% 적재 8.5 MJ/km ≈ 23.9 L/100km ≈
      TTW 약 640 g/km(WTW 약 832 g/km) — 산술 재검증 완료. 아시아·태평양(ASP)
      지역 기본: 12~20t 강성트럭, EURO II, 황 5000ppm, 경사 'hilly', 베트남
      국가 항목 없음(ASP 기본 그대로 적용).
    relevance: >-
      거리 기반 산정의 차급별 연비(L/100km) 출처. km당 g 값이 필요한 우리
      시나리오에 가장 직접적.
    caveat: >-
      Euro VI 표는 유럽 모터웨이 조건. ASP 기본(EURO II·황 5000ppm)은 베트남
      실제(황 ~500ppm, 2022~ 신차 Euro 5 연료)보다 보수적 — 그대로 쓰면 과대
      산정 가능.

  - id: L-india-sfc-template
    kind: literature
    t: 2026-07-16
    by: CC
    status: relevant
    source:
      title: "India Default GHG Emission Values (SFC, 2025-05, GLEC v3.01 보충)"
      authors: "Smart Freight Centre India"
      year: 2025
      venue: "SFC 공식 보충문서"
      url: "https://smart-freight-centre-media.s3.amazonaws.com/documents/India_Default_GHG_Emission_Values_SFC_INDIA_v1_2.pdf"
    claim: >-
      아시아 국가별 기본값의 최근접 선례이자 방법론 템플릿. 경유 TTW 2.675 +
      WTT 0.8058 ≈ WTW 3.48 kgCO2e/L. 차급별(WTW): 소형(<3.5t) 8.4 L/100km·
      379.5 g/t-km, 중형1(3~5t) 11.9·222.2, 중형2(5~12t) 14.9·140.0,
      대형1(12~20t) 17.3·90.2, 트랙터-트레일러(30~60t) 30.8·55.1.
      절차: 공차/만차 연비 → 평균 적재율·공차운행률 반영 → g/t-km, GWP는
      IPCC AR6 100년, 거리는 Google Distance Matrix + 5% 할증(DAF).
    relevance: >-
      DVP→CPRO 산정 절차를 그대로 복제할 수 있는 구조(거리도 우리처럼 Google
      기반 + 5% 할증). 베트남 값이 없는 상황에서 인도값은 아시아 신흥국 차급
      연비의 참고 밴드로 사용.

  - id: L-no-time-basis
    kind: literature
    t: 2026-07-16
    by: CC
    status: relevant
    source:
      title: "GLEC v3.2 — 시간(per-hour) 기준 산정법 부재 확인"
      authors: "Smart Freight Centre"
      year: 2025
      venue: "GLEC v3.2 전문 검색"
      url: "https://smart-freight-centre-media.s3.amazonaws.com/documents/GLEC_FRAMEWORK_v3.2_21_10_25_1.pdf"
    claim: >-
      GLEC의 도로 화물 배출원단위는 전부 tonne-km(또는 L/t-km) 기준. 시간당
      연료/배출 항목은 전문 검색 0건(공회전은 시스템 경계에 포함된다는 언급만).
      정체·공회전 영향의 표준 부합 반영 경로는 (a) 연료 기반 산정(실측에 자동
      반영) 또는 (b) 도구의 도로유형·구배 보정.
    relevance: >-
      "시간 기준 vs 거리 기준" 질문에 대한 직접 답 — 시간 기준은 표준에 없다.
      시간대(혼잡)는 배출계수가 아니라 소요시간 축으로 다루고, 배출은 거리 기반
      고정이 표준 부합.
    caveat: >-
      소극적 확인(부재 증명)이며 confidence medium. 정체가 배출을 얼마나 올리는지
      정량 claim은 검증 통과 실패(O-copert-congestion).
    related:
      - {type: raises, ref: O-copert-congestion}

  - id: L-vn-factor-absent
    kind: literature
    t: 2026-07-16
    by: CC
    status: relevant
    source:
      title: "베트남 국가 공인 배출계수의 국제 프레임워크 내 부재 + 폴백(영국 DESNZ 2024)"
      authors: "GLEC/EcoTransIT 전문 검색 + DESNZ"
      year: 2024
      venue: "GLEC v3.2·EcoTransIT 전문 grep, gov.uk 전환계수"
      url: "https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2024"
    claim: >-
      GLEC v3.2·EcoTransIT 어디에도 베트남 국가 항목 없음(전문 검색 0건, 국가표는
      북미·유럽/남미·중국·인도뿐). 국가 공인계수 부재 시 공인 폴백으로 영국
      DESNZ 2024 GHG 전환계수(GHG Protocol 인정 제3자 DB) 사용 가능 — 단 영국
      차량·적재 평균 기반이라 베트남 보정치 아님.
    relevance: >-
      "베트남 공식 계수를 찾아 쓰면 되지 않나"에 대한 답 — 국제 프레임워크엔 없고,
      GLEC 아시아 할증이 사실상 유일한 지역 공식값. MONRE 국내 고시는 미조사
      (O-monre-domestic).
    caveat: >-
      부재 확인은 국제 문서 한정 — 베트남 환경부(MONRE)/공상부 국내 간행물 직접
      조사는 안 됨.
    related:
      - {type: raises, ref: O-monre-domestic}

  - id: F-carbon-calc-recommendation
    kind: finding
    t: 2026-07-16
    by: CC
    status: active
    claim: >-
      DVP→CPRO 셔틀(48.9~49.6km) 배출 산정 권고 — ① 기준: 거리 기반(km).
      시간 기준은 표준에 없으므로 시간대(혼잡) 축은 소요시간·연료에만 반영하고
      배출계수는 거리 고정. ② 계산식: 배출량(kgCO2e) = 거리(km) × 연비(L/km) ×
      2.68(TTW) [보고 시 WTW 3.48 병기]. ③ 차급별 연비 기본값(L/100km):
      EcoTransIT Euro VI 표(예: 12~20t 60% 적재 23.9) 또는 인도 SFC 표(소형 8.4
      ~ 트랙터 30.8)를 밴드로 사용, GLEC 아시아 할증(+22%)로 보수 보정 가능.
      ④ t-km 원단위 보고가 필요하면 GLEC v3.2 아시아 적용값(밴 949 / 409 / 256 /
      152.5 gCO2e/t-km WTW). ⑤ 편도 거리 산정은 Google 거리 + 5% 할증(DAF,
      GLEC·인도 SFC 공통 관례) — 51.3~52.1km. 차급 선택이 지배 변수: 같은 화물량
      이면 대형 집약 운송이 t-km당 최대 ~7배 유리하나, 왕복 공차율이 기본 가정
      (17%)보다 크면(셔틀 ~50% 가능) 원단위가 크게 나빠짐(O-shuttle-empty-run).
    basis: >-
      deep-research 2026-07-16: 23/25 클레임 확정(대부분 3-0), 표준 원문 PDF 직접
      대조(L-standards-hierarchy, L-diesel-ef, L-glec-vehicle-defaults,
      L-ecotransit-fuel-defaults, L-india-sfc-template, L-no-time-basis).
      거리는 ledger_dvp_cpro_route#L-gmaps-dvp-cpro-tou 실측.
    related:
      - {type: based-on, ref: L-standards-hierarchy}
      - {type: based-on, ref: L-diesel-ef}
      - {type: based-on, ref: L-glec-vehicle-defaults}
      - {type: based-on, ref: L-ecotransit-fuel-defaults}
      - {type: based-on, ref: L-india-sfc-template}
      - {type: based-on, ref: L-no-time-basis}
      - {type: depends-on, ref: "ledger_dvp_cpro_route#L-gmaps-dvp-cpro-tou"}
      - {type: raises, ref: O-shuttle-empty-run}
      - {type: raises, ref: O-biodiesel-sulfur}

  - id: O-monre-domestic
    kind: open
    t: 2026-07-16
    by: CC
    status: open
    question: >-
      베트남 환경부(MONRE)·공상부가 국가 GHG 인벤토리/MRV 규정에서 도로 화물용
      공인 배출계수를 발행했는지 — 국제 프레임워크 부재만 확인됨, 베트남 국내
      문헌(베트남어 고시) 직접 조사 미완.

  - id: O-copert-congestion
    kind: open
    t: 2026-07-16
    by: CC
    status: open
    question: >-
      COPERT/HBEFA 속도-배출 곡선 기준으로 하노이권 정체(평균 20~30km/h)가
      g/km 배출을 정량적으로 얼마나 올리는지 — 관련 claim이 검증을 통과하지
      못해 미확인. 시간(속도) 보정이 유의미해지는 임계 조건 미상.

  - id: O-shuttle-empty-run
    kind: open
    t: 2026-07-16
    by: CC
    status: open
    question: >-
      DVP→CPRO 셔틀의 실제 운행 구조 — 복화(귀로 화물) 여부, 공차운행률, 평균
      적재율. GLEC 기본 가정(적재 60%, 공차 17%)과 달리 왕복 셔틀은 공차율
      ~50%일 수 있어 t-km 원단위가 크게 달라짐. KETI-77의 '트럭당 적재량
      assumption'과 함께 시나리오 설계에서 확정할 것.

  - id: O-biodiesel-sulfur
    kind: open
    t: 2026-07-16
    by: CC
    status: open
    question: >-
      베트남 시판 경유의 바이오디젤 혼합률(B5 등)·실제 황 함량이 연료 배출계수
      (TTW 2.68 kgCO2e/L 가정)에 주는 보정 폭.

  - id: L-single-echelon-levers
    kind: literature
    t: 2026-08-05
    by: CC
    status: relevant
    source:
      title: >-
        단일 공급처에서도 성립하는 운송 탄소 결정변수 — Boone & Ganeshan
        (Sustainability 17:4135, 2025) / Sebatjane (Annals of OR, 2025,
        DOI 10.1007/s10479-025-06466-2) / Tang et al. (IJPE 164:339-350, 2015)
      authors: "Boone & Ganeshan; Sebatjane; Tang, Wang, Cheng, Lai, Ji"
      year: 2025
      venue: "Sustainability / Annals of Operations Research / Int. J. Production Economics"
      url: "https://doi.org/10.3390/su17094135"
    claim: >-
      선행 연구는 '공급자 선정'을 결정변수로 요구하지 않는다 — 단일 계층
      (single-echelon)·단일 링크가 오히려 표준 설정이다. Boone & Ganeshan은
      500마일 거리의 단일 공급자를 고정하고 발주량 Q·재주문점 r·운송수단 m
      (LTL/TL/TOFC/Rail/Air)만 결정변수로 둔다(거리 D는 상수, 다중 원산지는
      향후 과제로 명시). Sebatjane은 창고-소매 단일 FTL 링크에서 소매 발주량
      Q_r 과 사이클당 출하 횟수 n 두 개만 둔다. Tang et al.은 공급처·경로를
      바꾸지 않고 정기검토 재고정책의 검토주기·발주량만 조정해 중간 수준
      감축목표를 총비용 영향 제한적으로 달성.
    relevance: >-
      ③ 물류 시나리오의 핵심 반론 해소 — CPRO는 공급기업이 DVP 한 곳뿐이라
      "최적화 자유도가 없다"고 보였으나, 문헌 기준으로 남는 레버는 넷:
      발주량(로트크기)·재주문점·출하 빈도·운송수단. 단, 이 레버가 실제로
      작동하려면 CPRO가 DVP의 보충 타이밍을 통제할 수 있어야 함
      (O-cpro-controls-schedule).
    caveat: >-
      전문 직접 확인은 Boone & Ganeshan 뿐. Sebatjane·Tang은 초록·메타데이터
      수준 검증. Sebatjane의 레버는 고정 단일 링크의 FTL 배칭·로트사이징이지
      다지점 경유 consolidation 이 아니므로 인용 시 표기 주의.
    takeaway: "deep-research 2026-08-04: 구성 claim 3건 전부 3-0 만장일치."
    related:
      - {type: raises, ref: O-cpro-controls-schedule}
      - {type: raises, ref: O-shipment-fixed-term}

  - id: L-shipment-freq-needs-fixed-term
    kind: literature
    t: 2026-08-05
    by: CC
    status: relevant
    source:
      title: "출하 빈도 레버의 성립 조건 — Sebatjane(2025) 배출항 구조 대조"
      authors: "Sebatjane; Tang et al."
      year: 2025
      venue: "Annals of Operations Research / Int. J. Production Economics"
      url: "https://link.springer.com/article/10.1007/s10479-025-06466-2"
    claim: >-
      출하 빈도(shipment frequency)를 레버로 쓰려면 배출 산정식에 '출하 1회당
      고정 배출항'이 있어야 한다 — 순수 tkm 계수(중량×거리)만 쓰면 빈도가
      수식에서 소거되어 효과가 정확히 0이 된다. Sebatjane은 이를 배출항에 트럭
      운행횟수 올림항 ceil(n·Q_r/T_c) 과 적재량 의존 연비
      (MPG_0 − α·n·Q_r·W_i/ceil(·)) 를 넣어 회피한다.
    relevance: >-
      우리 산정식(F-carbon-calc-recommendation)은 거리 기반 고정 — 즉 현재
      구조로는 출하 빈도·묶음배송 레버가 배출에 반영되지 않는다. 시나리오
      설계 전에 산정식부터 확장할지 결정해야 함(O-shipment-fixed-term).
    caveat: >-
      원 claim(Tang et al. 빈도 감축 효과)은 3-0이나 본 항목은 검증자 단서를
      승격한 것. Tang et al. 결과 자체의 경계조건: 공격적 감축목표는 미해결,
      감축비용이 단위 결품비용·리드타임에 비례, 보관측 배출은 모델 밖.
    related:
      - {type: raises, ref: O-shipment-fixed-term}
