  - id: L-fiveshipper-milkrun-gain
    kind: literature
    t: 2026-08-05
    by: CC
    status: relevant
    source:
      title: "공유운송(밀크런) vs 비공유 복합운송 vs 전구간 직송 비교 — 충칭 공단 5개 수출기업 가상 사례"
      authors: "Wang & Wang"
      year: 2025
      venue: "Frontiers in Marine Science 12:1686552"
      url: "https://www.frontiersin.org/journals/marine-science/articles/10.3389/fmars.2025.1686552/full"
    claim: >-
      기업 5곳(기업 간 7km, 공단→드라이포트 120km, 충칭→친저우항 1,300km)에서
      S1(공유운송=순회 집하) vs S2(비공유 복합운송) vs S3(전구간 직송 도로) 비교.
      S1이 S2 대비 집하거리 30km 일 때 2.15%, 120km 일 때 26.68% 절감
      (48 RMB/tCO2 환산 시 사이클당 0.66~13.49위안).
    relevance: >-
      '공급처가 적으면 최적화 무의미'에 대한 존재 증명 — 5곳 규모에서도 이득이
      0은 아니다. 다만 이득이 집하 반경 대비 간선 거리 구조에 강하게 좌우되며,
      CPRO 조건(편도 49km 단일 링크)은 이 곡선의 저구간(30km에서 2.15%)에 가깝다.
    caveat: >-
      **절대 수치 인용 금지.** 논문에 '64.13x10 kg' 표기 오류와 'S2가 S3 대비
      305.75% 절감'(100% 초과 감축)이라는 산술적으로 불가능한 값이 있고,
      이 논문에서 파생된 임계치·조건 명제 3건이 검증에서 전부 0-3 기각됐다.
      절감률을 쓰려면 논문의 배출계수로 재유도해야 함. 또한 가상 사례이며
      아웃바운드 수출 통합 구조(인바운드 부품 공급 아님), 밀크런 구간은 시간창·
      용량 제약을 푼 VRP 가 아니라 해석적 통합. 게재지도 내륙 육상물류에 부적합.
    related:
      - {type: raises, ref: O-direct-vs-milkrun-threshold}

