  - id: L-optimization-papers-ignore-standards
    kind: literature
    t: 2026-08-05
    by: CC
    status: relevant
    source:
      title: "최적화 논문의 배출 산정 정밀도 편차 — Boone & Ganeshan(2025) vs Kabadurmus & Erdogan(2022)"
      authors: "Boone & Ganeshan; Kabadurmus & Erdogan"
      year: 2025
      venue: "Sustainability / Gazi Univ. J. Fac. Eng. Arch."
      url: "https://doi.org/10.3390/su17094135"
    claim: >-
      조사된 1차 논문 중 GLEC framework·ISO 14083·EN 16258 을 명시적으로 채택한
      사례는 없다. 정밀한 축은 Boone & Ganeshan — 중량-거리 M=QwD 를 수단별
      연비로 나눠 연료량을 구하고 연료 배출계수를 곱함(디젤 10.19 kgCO2/gallon),
      논거는 GHG Protocol Scope 3 뿐이고 저자는 "there is no universal standard
      to calculate emissions" 라 적는다. 거친 축은 Kabadurmus & Erdogan —
      총 배출이 총 주행거리에 단순 비례, 적재중량도 속도 의존도 없음.
      Boone & Ganeshan 수치예제 배출 배분은 운송 5,105 / 재고 61.41 kg-yr
      (운송 98.8%).
    relevance: >-
      우리는 반대 방향 — 산정은 이미 표준(L-standards-hierarchy) 기반으로
      잡혀 있고 최적화 쪽이 비어 있다. 즉 표준 준거 산정식 위에 최적화를 얹는
      구성은 문헌 대비 오히려 강점이며, 이걸 기여점으로 서술 가능.
    caveat: >-
      '표준을 안 쓴다'는 이 논문들의 누락이지 표준의 부적합 근거가 아니다.
      ISO 14083 은 2023년 제정이라 이전 논문의 미언급은 당연. Boone & Ganeshan
      참고문헌 전수 확인은 MDPI 차단으로 미완 — '방법론 절 미언급'만 확정.
    related:
      - {type: supports, ref: L-standards-hierarchy}
      - {type: raises, ref: O-standards-in-optimization}

  - id: L-rl-absent-in-gvrp-review
    kind: literature
    t: 2026-08-05
    by: CC
    status: relevant
    source:
      title: "The green vehicle routing problem: A systematic literature review"
      authors: "Moghdani, Salimifard, Demir, Benyettou"
      year: 2020
      venue: "Journal of Cleaner Production 279:123691 (Cardiff ORCA eprint 134285 전문)"
      url: "https://www.sciencedirect.com/science/article/abs/pii/S0959652620337367"
    claim: >-
      2006–2019 GVRP 문헌 309편 리뷰의 해법 분류에 RL/ML 범주 자체가 없다.
      전문 키워드 계수: reinforcement=0, learning=0, machine learning=0.
      해법 분류는 5개 범주로 닫혀 있음(메타휴리스틱 41%, Exact 18%,
      Exact Solver 16%, Hybrid 14%, Heuristic 7%, Software 4%).
    relevance: >-
      RL 사용의 정당화 근거로 쓸 수 없다 — 이 근거는 '2019년까지 GVRP 실무에
      RL이 없었다'만 지지하고 'RL이 그린 라우팅에 부적합/유망하다' 어느 쪽도
      지지하지 않는다. CPRO가 RL을 운송에 쓰려면 별도 근거가 필요
      (O-rl-drl-since-2021).
    caveat: >-
      Figure 6 백분율은 'Not Applicable' 17편을 뺀 292편 기준이라 '309편 전체'는
      느슨한 표현. EVRP/GVRP 용 DRL 은 2021년경(Lin et al., IEEE T-ITS 2021)부터
      등장함이 검증자 독립조사에서 확인됨. 2-1 표결.
    related:
      - {type: raises, ref: O-rl-drl-since-2021}

  - id: O-rl-drl-since-2021
    kind: open
    t: 2026-08-05
    by: CC
    status: open
    question: >-
      2021년 이후 EVRP/GVRP 대상 DRL 연구(Lin et al. IEEE T-ITS 2021 계열)에서
      상태·행동·보상은 어떻게 설계되며, 어떤 하위문제(동적 주문 도착·확률적
      수요·실시간 재배차)에서 MILP/메타휴리스틱 대비 실측 이득이 보고됐는가.
      2026-08-04 deep-research 에서 RL 관련 후보 claim 4건이 전부 0-3 기각 —
      유효 근거 0건이므로 별도 재조사 없이는 보고서에 RL 서술을 쓰면 안 된다.
      2026-08-05 2차 조사(다지점 시나리오)에서도 재차 0건 — 검증 통과 16개
      주장 어디에도 DRL 논문이 없고, 확인된 해법은 전부 MILP·분기절단·
      NSGA-II/III·MOEA/D·SPEA2·VND 계열이었다. 두 번 연속 실패한 원인은
      조사 각도가 매번 '운송 탄소 최적화' 전체에 분산되어 RL 축에 예산이
      1/5 씩만 배분된 것으로 보임(검증자 WebSearch 예산 200/200 소진 보고).
      3차는 이 축만 단독으로 떼어 조사할 것.

