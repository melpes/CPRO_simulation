  - id: L-constraints-and-objective
    kind: literature
    t: 2026-08-05
    by: CC
    status: relevant
    source:
      title: >-
        제약 표준 세트와 비용-배출 목적함수 처리 — Boone & Ganeshan(2025) /
        Kabadurmus & Erdogan(Gazi Univ. MMF Dergisi, 2022,
        DOI 10.17341/gazimmfd.633583) / Rout et al.(JCLP 316:128256, 2021) /
        혼합선단 EVRP(ESwA, DOI 10.1016/j.eswa.2022.119228)
      authors: "Boone & Ganeshan; Kabadurmus & Erdogan; Rout, Paul, Kumar, Chakraborty, Goswami"
      year: 2025
      venue: "Sustainability / Gazi Univ. J. Fac. Eng. Arch. / J. Cleaner Production / Expert Systems with Applications"
      url: "https://doi.org/10.3390/su17094135"
    claim: >-
      제약 표준 세트는 셋 — (1) 서비스수준(결품률 또는 시간창 위반),
      (2) 차량·수단 적재용량, (3) 배출 상한(연간 탄소예산). 대체연료·전기차를
      다루면 주행거리 제한·충전소 수가 추가. Boone & Ganeshan 제약은 정확히
      이 셋이고 탄소예산 수치예제는 10,000 kgCO2/yr.
      목적함수 처리는 세 갈래이며 단순 가중합은 조사된 1차 논문 중 어디에서도
      채택되지 않았다 — (a) 규제(탄소세/cap-and-trade/cap-and-offset)로
      금전화 후 단일 이익·비용 목적, (b) 비용 최소화 + 배출 하드캡(ε-제약형,
      저자 축자: "we treated the carbon budget as a hard constraint rather
      than a price-based mechanism"), (c) 명시적 2목적 파레토(ε-제약법으로
      해 열거). 혼합선단 EVRP 수치: 비용 3% 미만 증가 수용 시 배출 18% 이상
      감축, 충전출력 90→350kW 시 비용 5% 감소.
      다만 MILP + ε-제약 전수 열거는 약 20노드에서 시간 제한 — 이 확장성
      한계가 메타휴리스틱이 최다 해법군인 이유.
    relevance: >-
      CPRO 운송 시나리오의 정식화 틀. 우리 상황에 직접 이식 가능한 형태는
      (b) — 총비용 최소화 + 연간 배출 상한을 스윕. 가중치(비용·배출 가중합)로
      시나리오를 표현하지 말라는 기존 입장과도 정합.
    caveat: >-
      '비용-배출 다목적이 GVRP 표준 형태'는 과잉일반화 — 단일 목적
      (pollution-routing 계열)이 상당 비중이므로 '흔한 정식화 계열'로만 표기.
      ε-제약 선호도 분야 규범이 아니라 개별 논문의 선택. Rout et al.·ESwA
      논문은 초록 수준 검증이라 다목적 해법의 구체는 미확정. 운전시간 규정
      (driver hours)은 근거 미확보.

