      운전시간 규정(driver hours), 창고/허브 위치, 재고-운송 통합
      (inventory-routing)은 조사 질문에 포함됐으나 검증 통과 claim이 0건 —
      조사 자체가 미완인지 문헌 비중이 낮은지 구분되지 않았다.

  - id: L-milkrun-2evrpspdtw
    kind: literature
    t: 2026-08-05
    by: CC
    status: relevant
    source:
      title: >-
        Route optimization of simultaneous delivery and pick-up in automotive
        inbound logistics under the milk-run mode in a dual-carbon background
      authors: "Zhang W."
      year: 2025
      venue: "Engineering Computations (Emerald)"
      url: "https://doi.org/10.1108/EC-12-2024-1056"
    claim: >-
      자동차 인바운드 밀크런의 표준 정식화는 2단계 VRP + 시간창 + 동시 납입·수거
      — 원문 명칭 'Two-echelon Vehicle Routing Problem with Time Windows and
      Simultaneous Delivery and Pickup (2E-VRPSPDTW)'. 구조는 공급자→통합센터
      →OEM. 사례 규모: 공급자 30곳, 자사 물류센터 2곳, OEM 1곳(3PL 실데이터),
      일 650 컨테이너, 차급 3종(6.8m/7t/31컨, 9.6m/16t/45컨, 13m/30t/62컨).
      빈 컨테이너를 능동 관리 변수로 취급(중첩 시 적재 1/5). 목적 3개 =
      총비용(차량 기동·운송·통합센터·페널티) / CO2 / 서비스수준(시간창 충족률
      + 주문충족률 가중 합성). 처리는 가중합·ε-제약이 아닌 비지배정렬 기반
      INSGA-II 파레토, 벤치마크도 전부 파레토 MOEA(MOEA/D, SPEA2, Pareto-TS).
    relevance: >-
      CPRO에 공급처가 늘 때 쓸 정식화 골격. 특히 '빈 용기 회수'를 결정변수로
      두는 구조는 DVP 셔틀의 왕복 공차 문제(O-shuttle-empty-run)와 직결 —
      귀로에 빈 용기·트레이를 싣는 순간 공차구간이 유상구간으로 바뀐다.
    caveat: >-
      보고된 정량 성과는 알고리즘 품질(HV가 표준 NSGA-II 대비 약 10% 향상)뿐이며
      '밀크런 도입으로 배출 X% 감소' 수치는 이 논문에서 인용 불가(해당 주장은
      1-2로 기각). 서비스수준 목적 내부엔 가중치가 있으므로 '가중치 없음'으로
      읽으면 안 됨. 30-공급자 인스턴스라 2~5개 소규모 질문의 근거는 아님.
    related:
