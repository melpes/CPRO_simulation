  - id: L-multistop-objective-taxonomy
    kind: literature
    t: 2026-08-05
    by: CC
    status: relevant
    source:
      title: >-
        다지점 운송 문헌의 비용-배출 처리 4갈래 — Zhang(EC 2025) / Shi & Lin
        (J. Phys. Conf. Ser. 2583:012008, 2023) / Fang, Du & Qiu
        (Sustainability 9(12):2198, 2017) / Mukherjee et al.
        (Mathematics 11(13):2880, 2023) / Xu, Huang & Xiao (Sustainability 15(9):7639, 2023)
      authors: "Zhang; Shi & Lin; Fang, Du & Qiu; Mukherjee et al.; Xu, Huang & Xiao"
      year: 2023
      venue: "Engineering Computations / J. Phys. Conf. Ser. / Sustainability / Mathematics"
      url: "https://doi.org/10.1088/1742-6596/2583/1/012008"
    claim: >-
      '다목적'이라는 통칭으로 묶으면 오독된다 — 최소 네 갈래다.
      (a) 파레토형: Shi & Lin 의 open multi-depot green VRPTW 는 비용·배출을
      별도 목적으로 NSGA-III 파레토(비지배해 26개). 최종해는 비용단일최적 대비
      비용 -9.12%/배출 +17.79%, 배출단일최적 대비 배출 -13.82%/비용 +138.26%.
      (b) 탄소가격 내재화(사실상 가중합): Fang et al. 목적 = 비용 +
      p_c(총배출 − E). 캡 E 가 상수라 argmin 에서 소거되어 캡 수준은 결정을
      바꾸지 못하고 탄소가격만 작동.
      (c) 비용화 + 하드캡: Mukherjee et al.(역물류 크로스도킹) 은 단일 목적에
      탄소요금을 포함하면서 별도로 엄격 탄소상한 부등식(식 9)을 부과. 녹색기술
      투자 시 총비용 +약 2%, 배출 -23%.
      (d) 배출항 아예 없음: Xu et al.(중국 자동차부품 밀크런 3PL) 은 목적이
      운송비+페널티뿐이고 배출은 결론에서 '향후 연구'로 미룸.
    relevance: >-
      1차 조사의 3갈래(L-constraints-and-objective)를 다지점 문헌에서 재확인·
      확장. CPRO 정식화 선택 시 (b)의 함정을 특히 주의 — 탄소가격 내재화형은
      캡을 넣어도 캡이 결정을 바꾸지 않는다.
    caveat: >-
      (b)의 '캡이 결정을 못 바꾼다'는 성질은 배출권 매매가 단일가·무제한이라는
      가정에서만 성립 — 매수/매도가가 다르거나 거래량 상한·하드캡이 있으면
      캡이 실행가능성에 들어와 결정을 바꾼다. cap-and-trade 일반으로 확장 금지.
      J. Phys. Conf. Ser. 는 경량 심사 논문집이라 수치 인용 신중.
    related:
      - {type: supports, ref: L-constraints-and-objective}

  - id: L-carbon-price-moves-frequency
    kind: literature
    t: 2026-08-05
    by: CC
    status: relevant
    source:
      title: "탄소가격의 실제 레버는 차량 대수가 아니라 방문 빈도 — Fang, Du & Qiu Table 5"
      authors: "Fang, Du & Qiu"
      year: 2017
      venue: "Sustainability 9(12):2198"
      url: "https://doi.org/10.3390/su9122198"
    claim: >-
      기본설정(Class I, n=15, |T|=6, |K|=4)에서 탄소가격 p_c=0 → 총비용 8284,
      총배출 17,314, 방문수 38.4, 사용차량 3대. p_c=0.7 → 총비용 9904,
      총배출 17,195, 방문수 10.6, 사용차량 3대. 즉 방문수는 -72% 급감하나
      차량대수는 전 행에서 3대 고정(4개 클래스 전부 동일 패턴).
      기전: 연료비 675.8→579.7, 경로배출 3134→2688.1(-14%)인 반면 재고비
      1307.6→1580.3, 재고배출 1568→1895(+21%) — 적게·크게·덜 자주 실어 나르고
      재고로 흡수. 총배출은 p_c=0.3 에서 최소(17,119, -1.1%) 후 재상승,
      본문 원문 "total emission levels do not decrease monotonically".
    relevance: >-
      CPRO 시나리오 설계의 가장 실용적 신호 두 가지. ① 탄소가격을 축으로 두면
      움직이는 건 배차 대수가 아니라 납입 빈도다 — 1차 조사의 '출하 빈도가
      핵심 레버'(L-single-echelon-levers)와 독립적으로 수렴.
      ② '탄소가격 올리면 배출 준다'는 전제가 실증에서 깨진다. 경로배출 감소를
      재고배출 증가가 상쇄하므로, 재고측 배출을 모델에 넣지 않으면 결론이
      뒤집힌다.
    caveat: >-
      (a) 'NVI 가 레버'라는 해석은 표 판독 추론이며 저자 본문 주장이 아님(2-1).
      (b) 총배출 17,314 중 생산배출 12,612 가 상수라 -1.1% 는 희석된 값이고
      운송 성분만 보면 -12~14%. (c) 차량 3대 고정은 가용 4대·수요 규모에 종속.
      (d) 합성 인스턴스 1개·유도탐색 해라 0.2~1% 진동은 솔버 갭 수준일 수 있음.
      (e) 아웃바운드 생산-경로 문제로 인바운드 밀크런과 구조가 다름.
    related:
      - {type: supports, ref: L-single-echelon-levers}
      - {type: raises, ref: O-lineside-inventory-cap}

  - id: L-multistop-papers-use-fuel-backcalc
    kind: literature
    t: 2026-08-05
    by: CC
    status: relevant
    source:
      title: "다지점 문헌 6편 전수의 배출 산정 방식 — 연료소비 역산, tkm 아님"
      authors: "Zhang; Fang et al.; Mukherjee et al.; Shi & Lin; Purba et al.; Xu et al."
      year: 2025
      venue: "6편 전문 키워드 검색"
      url: "https://doi.org/10.3390/su9122198"
    claim: >-
      확인된 6편 전수에서 GLEC/ISO 14083/Scope 3/tkm 키워드가 전문 검색상 0건.
      대신 세 계열 — (1) 연료소비율×거리 후 국가 환산계수: Zhang 의
      MinEco2g = Eag×γ×τ, γ=1.471(표준석탄 환산), τ=2.925, 차급별 연료소비율
      0.2/0.27/0.35 per km(γ·τ는 중국 GB/T 2589 계열, 국제 일반값 아님).
      (2) 적재의존 역학 연료모델(Bektas-Laporte pollution-routing):
      Fang et al. P_ijt = α_ij(ω + u_ijt + v_ijt)l_ij + β(l_ij/τ_ij)^2 l_ij,
      ω=공차중량, 속도는 전 arc 40km/h 고정. (3) 속도의존 함수:
      Mukherjee et al. (a0 + a1·V + a2·V^3 + a3/V^2). Shi & Lin 은 거리 비례
      단순형, Purba et al. 은 계산 없이 '트럭 대수 감소'로 정성 귀속.
    relevance: >-
      1차 조사 결론(L-optimization-papers-ignore-standards)의 다지점 문헌 재확인
      — 표본 6편 전수라 더 강한 증거. 중요한 실질 함의: 적재의존 모델은 공차중량
      ω 가 배출에 직접 들어가므로 그 이득 구조가 tkm 선형계수로는 표현되지
      않는다. CPRO 가 tkm 산정을 채택하면 이 논문들의 감축 메커니즘 일부가
      원리적으로 재현되지 않으며, %수치도 직접 비교 불가.
    caveat: >-
      Zhang 논문은 연료소비율을 RMB/km 로 표기하면서 Eag 를 물리 연료량으로
      다루는 단위 불일치가 있어 수치 재현 불가.
    related:
      - {type: supports, ref: L-optimization-papers-ignore-standards}
      - {type: raises, ref: O-tkm-vs-fuel-model-gap}

