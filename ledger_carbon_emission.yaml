      시나리오 축을 하나 더 준다. 결정변수 자유도가 좁을 때 시나리오 폭을
      확보하는 문헌적 근거.
    takeaway: "3-0 만장일치."

  - id: L-modal-shift-not-only-lever
    kind: literature
    t: 2026-08-05
    by: CC
    status: relevant
    source:
      title: "연비 개선이 모달 시프트의 대체재 — Boone & Ganeshan 4.2절 민감도 분석"
      authors: "Boone & Ganeshan"
      year: 2025
      venue: "Sustainability 17:4135"
      url: "https://doi.org/10.3390/su17094135"
    claim: >-
      연 10만 단위에서 LTL은 연비 100 ton-mile/gallon 일 때 5,166 kgCO2.
      상한을 5,000 kg 로 조이면 LTL 탈락하고 더 비싼 TOFC 로 강제 전환
      (연 USD 9,422 추가). 그러나 연비를 150 ton-mile/gallon 으로 올리면
      3,465 kg 으로 떨어져 상한 아래 복귀 — 개선 투자비가 수단 전환
      프리미엄보다 싸면 수단을 바꾸지 않는 것이 최적.
    relevance: >-
      CPRO는 DVP→CPRO 단일 육상 링크라 모달 시프트 자체가 불가능에 가까운데,
      그 경우에도 '적재효율·차급' 레버가 같은 자리를 대신한다는 근거.
      기존 F-carbon-calc-recommendation 의 "차급 선택이 지배 변수" 관찰과 정합.
    caveat: >-
      CPG 산업 대표값 예시일 뿐 실기업 데이터 아님. 100→150 은 50% 개선이라
      기술적 달성가능성을 논문이 평가하지 않음. 2-1 표결.
    related:
