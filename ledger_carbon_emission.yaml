    question: >-
      공급처 2~5개 구간에서 직송이 밀크런보다 우월하다는 결론을 낸 논문이 실제로
      존재하는가. 2차 조사에서 해당 후보(doi 10.22610/jsds.v4i2.734)의 주장 4건이
      전부 1-2 또는 0-3 기각되어 '적은 공급처에서는 직송 우월'이라는 대칭 근거가
      0건으로 남았다 — 이 비대칭(밀크런 이득 쪽만 근거 있음)을 결론에 그대로
      반영하면 편향된다. 밀크런 이득이 사라지는 최소 조건(공급자 수·지리적
      분산·물량·픽업 빈도) 민감도 분석 논문을 표적 재조사 필요.
      단, CPRO 조건(편도 49km)에 대한 답은 문헌보다 자체 파라미터 감도분석이
      빠를 가능성이 높다.

