    by: CC
    status: open
    question: >-
      배출 레버가 방문 빈도(로트 대형화 + 재고 흡수)로 작동할 때, 늘어난
      라인사이드 재고와 JIT 납입 주기 제약이 어디서 실제 상한을 거는가.
      Fang et al. 에서 재고배출 +21% 가 경로배출 -14% 를 상쇄한 사례가 있으므로,
      CPRO 조립공장의 라인사이드 재고 한계를 제약으로 넣지 않으면 결론이
      뒤집힐 수 있다.

  - id: O-tkm-vs-fuel-model-gap
    kind: open
    t: 2026-08-05
    by: CC
    status: open
    question: >-
      GLEC Framework 또는 ISO 14083 의 tkm 기반 산정을 실제로 적용해 밀크런·
      통합운송 감축량을 보고한 연구가 존재하는가. 존재한다면 연료 역산 방식과
      결과가 얼마나 갈리는가 — 적재의존 모델(공차중량이 배출에 직접 들어감)의
      이득이 tkm 선형계수로는 표현되지 않으므로, CPRO 가 Scope 3 cat.4 체계를
      쓸 경우 이 대조가 곧 방법론 선택 근거가 된다.
