  - id: F-classification-axes-defined
    kind: finding
    t: 2026-08-10
    by: CC
    status: active
    claim: >-
      계층별 분할 축을 확정했다 — 서브모델은 '변하는가'(생산량·기간에 따라 변하면 oper/MCF,
      안 변하면 tech), area(1단)는 '제품 분류'(표준이 정한 축), 절(2단)은 '무엇에 관한
      값인가'(주제) + '누구의 값인가'(설비 전체/구성품), 하위 절(3단)은 절마다 다르며 섞이는
      성격이 있을 때만 만든다, 구성품 안은 '값의 종류'(사양·관측=Property, 상하한=Range,
      하위 구성품=Entity). 그 위에서 tech 10절·oper 8절 각각에 '들어옴 / 안 들어옴'을
      명시했다 — 예: CommunicationAndControl 은 '무엇을 지원하는가'만, 실제 엔드포인트는
      AID 소관. MaintenanceAndReliability 는 보전 사양만, 실제 이력은 oper History.
      Utilities 와 HandledObjects 의 경계는 '제품에 남는가'.
    basis: >-
      골격 파일 docs/설비AAS_구조안_예시/EquipmentTemplate.json (SMC 35, SML 4, Entity 4,
      Property 0, basyx 검증 통과, kind=Template/assetKind=Type) 각 절 description 에 판정 기준
      기재. 설계안 §11.4~11.5.
    related: [{type: based-on, ref: D-classification-not-property-template}]
    tags: [분류축, 골격, 판정기준]

  - id: F-slot-coverage-check
    kind: finding
    t: 2026-08-10
    by: CC
    status: active
    claim: >-
      AAS자료모음의 property 후보 168건(11개 AAS 후보)을 분류 골격에 배치한 결과 167건(99%)이
      자리를 찾았고 미분류는 1건('테이블(척) 냉각유체 분사' — 값이 아니라 동작 서술).
      그러나 150건(89%)이 '공정 조건' 한 성격에 몰려 ProcessPerformance/ProcessSetting 절이
      비대해진다. 하위 축 후보를 재보니 물리량 축은 146/150(97%) 분류되나 나누면 '온도 44개'가
      한 칸에 모여 무의미하고, 공정 단계 축은 75/150(50%)만 작동한다(공정 압력·기판 온도처럼
      단계가 이름에 없는 것이 절반). 본질은 대상 축('무엇의 온도인가')이지만 슬롯 이름 절반이
      대상을 밝히지 않아 지금 자료로는 끝까지 갈 수 없다 — 자료 보완이 선행 항목.
      구성품 귀속은 47건(27%), 16종 등장(ProcessChamber 8·Nozzle 8·SourceTank 4·
      PrintingPlate 4 등)으로 구성품 축은 유효. tech 공통 절 6개(EnergySupply·Utilities·
      InstallationAndEnvironment·Safety·MaintenanceAndReliability·CommunicationAndControl)는
      0건 — 특허·논문 자료원이 설비 사양을 주지 않기 때문이며 절 설계 문제가 아니다.
      ZEUS 포털 자료 252건(설비 사양 위주, 공정 조건 거의 없음)과 정반대이므로,
      설비 AAS 하나를 채우려면 두 자료원이 모두 필요하다.
    basis: >-
      _슬롯_목록.xlsx 시트 'AAS별 슬롯' 168행 전량 분류(스크립트 coverage2.py, 원문 컬럼으로
      성격 확인). 1판에서 RF 파워·DC 전압을 EnergySupply로 보낸 것은 오분류였고
      (설비 전원 사양이 아니라 공정 구동 신호 — F-8box-fails-process-equipment의 (2)와 같은 건)
      2판에서 공정 조건으로 정정. 정리: docs/설비AAS_구조안_예시/커버리지_AAS자료모음.md
    related:
      - {type: supports, ref: F-classification-axes-defined}
      - {type: supports, ref: A-fab-source-depth}
    tags: [커버리지, 검증, 자료원]

