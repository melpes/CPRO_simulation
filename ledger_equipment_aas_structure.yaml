  - id: F-8box-fails-process-equipment
    kind: finding
    t: 2026-08-10
    by: CC
    status: active
    claim: >-
      설계안 8칸(성능·대상물·에너지·환경·통신제어·안전·보전·유형)을 성격이 다른 설비군에
      적용하면 공정장비에서 무너진다. FAB 44종 252 파라미터 중 93건(37%)이 8칸에 자리가
      없고, SMT 7종 188건에서는 39건(21%)이 없다. 자리 없는 것의 최대 항목은 구성품/유닛별
      사양(FAB 66, SMT 10) — KASMO도 같다(전해도금조 사양 11개 중 6개, 에칭장비 6개 중 5개가
      구성품 단위). 그 밖에 공정용 전기·광 파라미터(FAB 23), 소모품·물질(15), 소프트웨어(4),
      능력 목록(SMT 6, AOI 검출 결함 유형), 유틸리티(진공·N2·순수·배기)가 담기지 않는다.
      Energy 칸은 '설비 소비전력'과 '공정 구동·측정 신호'를 구분하지 못한다.
      결론: 8칸은 설비를 블랙박스로 보고 벤더 카탈로그 스펙을 적는 구조이며, 구성품 축이
      1급 자리로 빠져 있다. OPC UA 40001-1 §10·11(구성품 식별·목록)과 §17(부착 장비),
      IDEF0 ICOM의 유틸리티·배출 축도 대응 자리가 없다.
    basis: >-
      docs/원본자료/keti-fab/포털수집/_파라미터_통합.json(FAB 44종 252건) +
      aas_data/*.json(SMT 7종 188건) 키워드 규칙 분류 + 미분류 손 보정
      (스크립트 $CLAUDE_JOB_DIR/tmp/fit2.py, 경계 사례로 ±5% 오차).
      KASMO 4종 .aasx TechnicalData 리프 경로 파싱.
    related:
      - {type: contradicts, ref: F-layering-rules}
      - {type: based-on, ref: L-opcua-machinery-bbb}
      - {type: based-on, ref: L-idef0-ump}
    tags: [검증, 구조결함, 구성품축]

  - id: A-fab-source-depth
    kind: assumption
    t: 2026-08-10
    by: CC
    status: holding
    assumption: >-
      FAB 44종 자료에서 통신제어(0건)·안전(0건)·보전(2건) 칸이 비는 것은 설비에 그 특성이
      없어서가 아니라 자료원(ZEUS 장비 예약 포털) 수집분의 카탈로그 깊이가 얕기 때문이다.
    rationale: >-
      같은 칸이 SMT 벤더 카탈로그 기반 AAS에서는 55건으로 채워진다. 자료원 성격 차이가
      설비 특성 차이보다 개연성이 높다.
    breaks_if: >-
      FAB 현장 방문에서 해당 설비들의 매뉴얼·사양서를 확인했는데도 통신·안전·보전 항목이
      실제로 없는 것으로 확인되면 이 전제는 깨지고, 칸 구성을 설비군별로 나눠야 한다.
    related: [{type: depends-on, ref: F-8box-fails-process-equipment}]
    tags: [검증한계, 현장확인필요]

  - id: F-mcf-boundary-and-name-clash
    kind: finding
    t: 2026-08-10
    by: CC
    status: active
    claim: >-
      TechnicalData에 에너지·유틸리티 절을 두면 기존 MCF 서브모델과 겹친다. 실측 결과 MCF
      Inputs 안에 정격(RatedPower=7.82, EnergyType, PowerFactor, Utilities의 UtilityType·
      FlowRate·Pressure)과 실적(ConsumptionRate, AllocatedConsumption)이 함께 들어 있다.
      경계 기준은 '생산량·기간에 따라 변하는가' — 변하면 MCF/OperationalData, 안 변하면
      TechnicalData. 표현하면 TechnicalData는 '무엇을 어떤 방식으로 쓰는가',
      MCF는 '얼마나 썼는가'. 또 MCF > Inputs > Components 와 Recipes > MountedComponents가
      '투입 부품' 뜻으로 Components를 이미 점유하고 있어, 설비 하위 장치 절에 같은 이름을
      쓸 수 없다. OperatingHours도 MCF·OperationalData·IDTA 02066(PVM) 세 곳과 겹친다.
    basis: "aas_data/Mounter.json MCF 서브모델 전체 트리·값 파싱 (2026-08-10)"
    related:
      - {type: raises, ref: O-mcf-operational-overlap}
      - {type: depends-on, ref: F-8box-fails-process-equipment}
    tags: [mcf, 경계, 용어충돌]

  - id: L-aas-entity-bom
    kind: literature
    t: 2026-08-10
    by: CC
    status: relevant
    source:
      title: "AAS 메타모델 Entity/EntityType + IDTA 02011-1-1 Hierarchical Structures enabling BoM"
      authors: "IDTA"
      year: 2023
      venue: "IDTA-01001 Part 1 Metamodel v3.0.1 / IDTA 02011-1-1 템플릿 json"
      url: "https://industrialdigitaltwin.org/wp-content/uploads/2024/06/IDTA-01001-3-0-1_SpecificationAssetAdministrationShell_Part1_Metamodel.pdf"
    claim: >-
      AAS 메타모델은 구성품을 Entity 하나로 표현하고 entityType으로 두 형태를 가른다 —
      SelfManagedEntity는 자체 AAS를 가지며 globalAssetId 또는 specificAssetIds가 필수,
      CoManagedEntity는 자체 AAS 없이 상위 AAS가 관리하며 식별자를 갖지 않는다.
      IDTA 02011-1-1은 이 Entity 트리를 별도 서브모델로 표준화 —
      EntryNode(Entity) > Node(Entity, 재귀) + RelationshipElement SameAs/IsPartOf/HasPart
      + Property BulkCount, 최상위에 ArcheType(Full/OneDown/OneUp).
    relevance: >-
      "박막증착장비의 챔버는 각각 AAS인데 간단한 모듈은 SMC/SML로 표현된다"는 문제를 표준이
      이미 하나로 통합해 둔 것 — 구조를 두 벌 만들 필요 없이 같은 자리에 Entity를 놓고
      entityType으로 분기한다. 구성 트리 자체는 HierarchicalStructures 서브모델로 분리.
    takeaway: >-
      우리 MCF의 IsPartOf_Ref/HasPart_* 는 제품(PCB) 구성이므로, 설비 구성 트리는
      별도 HierarchicalStructures 서브모델로 둔다.
    related: [{type: answers, ref: O-component-axis-treatment}]
    tags: [구성품축, entity, bom]

