  - id: D-material-utility-energy-split
    kind: decision
    t: 2026-08-10
    by: user
    status: active
    decision: >-
      투입을 세 축으로 나누고 각각 다른 절에 둔다 — 재료(제품에 물리적으로 편입: 도금액·PR·
      잉크·솔더페이스트·증착 전구체) → 대상물·재료 절, 유틸리티(소모되나 제품에 안 남음:
      N2 분위기·압축공기·냉각수·순수·진공·배기·에칭가스) → 유틸리티 절,
      에너지(구동 동력: 전력·LNG·스팀) → 에너지 절. 판정 질문은 '제품에 남는가'.
      따라서 유틸리티는 에너지 절에 넣지 않고 별도 절로 분리한다.
    reason: >-
      "설비를 사용해서 연료로 소모되는 것과 설비에서 아예 재료로 쓰는 것은 다르다"(사용자).
      이 3분류는 우리 MCF가 이미 쓰는 축(RawMaterials/Utilities/Energy)이고 LCA 표준의
      raw material / ancillary material / energy carrier 구분과도 일치하므로, TechnicalData가
      다르게 나누면 두 서브모델이 어긋난다. 평면 분리하면 깊이 3을 유지한다.
    scope: "TechnicalData 주제 절 구성 및 MCF Inputs 축 정합"
    related: [{type: answers, ref: O-utility-axis}, {type: based-on, ref: L-idef0-ump}]
