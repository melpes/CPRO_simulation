mode: review
entries:
  # ---------------- 선행조사 (국제 표준) ----------------
  - id: L-idef0-ump
    kind: literature
    t: 2026-08-10
    by: CC
    status: relevant
    source:
      title: "IDEF0 (FIPS PUB 183) + ASTM E3012 Unit Manufacturing Process 정보모델"
      authors: "NIST / ASTM E60.13"
      year: 2022
      venue: "FIPS PUB 183, ASTM E3012-22, NIST UMP Builder"
      url: "https://www.nist.gov/publications/reference-schema-unit-manufacturing-process-information-model"
    claim: >-
      IDEF0은 활동을 ICOM 4변(Input 변환되어 소모 / Control 규율하되 불변 /
      Output 산출 / Mechanism 수행자원)으로 규정하는 표기법이며, 설비 자체의
      데이터 모델은 아니다. ASTM E3012의 UMP 정보모델이 이를 제조 단위공정용
      데이터 모델로 특화해 inputs/outputs/product information/process
      information/manufacturing resources + transformation 으로 정의한다.
      선행연구는 UMP의 표현 기법으로 IDEF0을 지목(IPO 다이어그램과 동형 + 계층분해).
    relevance: >-
      사용자가 출발점으로 지목한 IDEF0의 정확한 위상 — 설비 요소 정의표가 아니라
      경계 판정 기준. 어떤 값이 TechnicalData(Mechanism 제원)로 가고 어떤 값이
      OperationalData의 Control(레시피·작업지시·임계값) 또는 Input(자재·에너지)으로
      가는지 다투지 않게 하는 데 쓸 수 있다.
    takeaway: >-
      우리 MCF 서브모델(Inputs: RawMaterials/Energy/Utilities/Components →
      MCFValue → Product)이 이미 UMP 형태다. 일반화 설계 시 MCF와 중복 경계를
      먼저 정해야 한다.
    caveat: "IDEF0 자체는 설비를 Mechanism 화살표 하나로 취급 — 그대로는 스키마가 못 된다."
    tags: [idef0, ump, 경계]

  - id: L-idta-technicaldata
    kind: literature
    t: 2026-08-10
    by: CC
    status: relevant
    source:
      title: "IDTA 02003-2-0 Generic Frame for Technical Data for Industrial Equipment in Manufacturing"
      authors: "IDTA"
      year: 2023
      venue: "IDTA Submodel Template"
      url: "https://industrialdigitaltwin.io/idta-submodel-templates/Generic%20Frame%20for%20Technical%20Data%20for%20Industrial%20Equipment%20inManufacturing/v2.0/index.html"
    claim: >-
      최상위는 GeneralInformation(1) / ProductClassifications(0..*) /
      TechnicalPropertyAreas(0..*) / FurtherInformation(0..1) /
      SpecificDescriptions(0..*) 5칸. 실제 제원이 들어가는 TechnicalPropertyAreas에
      대해 표준이 규정하는 것은 "가독성을 위해 SMC로 대·소 절 구성 가능"과
      "속성에 ECLASS/IEC CDD semanticId 부여" 두 가지뿐 — 절 이름·깊이·필수 속성을
      정하지 않는다.
    relevance: >-
      TechnicalData 일반화의 표준 답은 '구조 일반화'가 아니라 '의미(semanticId)
      일반화'다. 모든 설비 공통 속성 목록을 만들려는 시도는 표준이 택하지 않은 방향.
      공통으로 고정할 수 있는 건 속성이 아니라 절 구조뿐.
    gap: >-
      "그럼 절 구조는 어떻게 나누나"에 대해 표준이 답을 주지 않는다 — 여기가 우리가
      정해야 하는 지점.
    tags: [technicaldata, idta]

  - id: L-opcua-machinery-bbb
    kind: literature
    t: 2026-08-10
    by: CC
    status: relevant
    source:
      title: "OPC UA for Machinery Part 1: Basic Building Blocks (OPC 40001-1) v1.04.1"
      authors: "OPC Foundation / VDMA"
      year: 2026
      venue: "OPC UA Companion Specification"
      url: "https://reference.opcfoundation.org/specs/OPC-40001-1/4"
    claim: >-
      설비 공통 기본 블록을 규정 — §8 설비 식별·명판, §9 서버 내 설비 목록,
      §10 구성품 식별·명판, §11 구성품 목록(MachineComponentsType),
      §12 MachineryItemState(상태기계), §13 MachineryOperationMode,
      §14 Operation Counter(PowerOnDuration/OperationDuration/OperationCycleCounter),
      §15 Lifetime Counter, §16 Monitoring, §17 MachineryEquipment, §18 Notifications.
    relevance: >-
      "대부분의 설비에 일반화되는 구조"를 정면으로 겨냥한 유일한 표준. 특히 §10·11이
      설비 간 차이를 '구성품 목록'이라는 한 축으로 몰아넣는 해법을 제시한다 —
      우리 OperationalData 뼈대의 1순위 참조.
    takeaway: "최상위는 얕게 고정, 변동은 구성품(Component) 축으로 흡수."
    tags: [operationaldata, opcua, 구성품축]

  - id: L-state-models
    kind: literature
    t: 2026-08-10
    by: CC
    status: relevant
    source:
      title: "PackML(ANSI/ISA-88 Part 5, OMAC) 17 states + SEMI E10 6 states / E116 EPT"
      authors: "OMAC / ISA / SEMI"
      year: 2020
      venue: "ISA-88 Part 5, SEMI E10, SEMI E116"
      url: "https://www.omac.org/packml"
    claim: >-
      PackML은 설비 상태를 17개(Idle, Starting, Execute, Completing, Complete,
      Resetting, Holding, Held, Unholding, Suspending, Suspended, Unsuspending,
      Stopping, Stopped, Aborting, Aborted, Clearing)로 고정하고, 그 부분집합을
      unit mode로 묶는다. SEMI E10은 설비의 모든 시간이 6상태(Productive, Standby,
      Engineering, Scheduled Downtime, Unscheduled Downtime, Non-Scheduled) 중
      하나에 속하도록 강제하고, E116(EPT)은 그 6상태를 사람 입력 없이 설비 데이터로
      산출하는 하위 추적 규격이다.
    relevance: >-
      운전 모드·상태를 자유 문자열로 두면 설비마다 어휘가 갈린다. KASMO의
      OperatingMode.PresentOperationMode 값 어휘를 열거형으로 고정할 때의 근거.
    caveat: "PackML은 포장기계 출신, SEMI는 반도체 출신 — 우리 설비군에 그대로 이식되는지는 별도 판단 필요."
    tags: [operationaldata, 상태기계]

  - id: L-iso22400-time
    kind: literature
    t: 2026-08-10
    by: CC
    status: relevant
    source:
      title: "ISO 22400-2 제조운영관리 KPI 정의 (OEE 및 시간 요소)"
      authors: "ISO/TC 184"
      year: 2014
      venue: "ISO 22400-2:2014"
      url: "https://www.iso.org/standard/54497.html"
    claim: >-
      KPI 34종을 식과 함께 정의하고, 그 재료가 되는 시간 요소를 명명한다 —
      Planned Busy Time, Actual Production Time, Planned Run Time per Item,
      Produced Quantity, Good Quantity, TTF/TBF/TTR 등. KPI 요소는 IEC 62264
      (ISA-95)의 work unit에 정렬시킨다.
    relevance: >-
      KASMO ProductionOperatingLog(OperationTime/DownTime/OperationPlanTime/
      AccumulationOperationTime)가 이 자리에 해당한다. 다만 각 항목이 ISO 22400
      어느 시간 요소인지 KASMO 산출물에 명시돼 있지 않아, 그대로 쓰면 OEE 산식이
      달라질 수 있다.
    gap: "KASMO 시간 항목 ↔ ISO 22400 시간 요소 매핑이 비어 있음 — 우리가 채울 자리."
    tags: [operationaldata, 시간모델, oee]

  - id: L-mtconnect-dataitems
    kind: literature
    t: 2026-08-10
    by: CC
    status: relevant
    source:
      title: "MTConnect Standard Part 2.0 Devices Information Model / Part 3.0 Observation Information Model"
      authors: "MTConnect Institute"
      year: 2024
      venue: "MTConnect Standard"
      url: "https://docs.mtconnect.org/MBSD_MTConnect_Part_2_2_0_0.pdf"
    claim: >-
      설비를 Device→Component 계층으로 분해하고 각 Component에 DataItem을 붙이되,
      DataItem은 SAMPLE(연속 아날로그) / EVENT(이산 정보) / CONDITION(정상·경고·고장
      판정) 세 범주뿐이다.
    relevance: >-
      관측값을 3범주로 나누는 규율. KASMO는 ActualDataMonitoring(연속) /
      AlarmCode(사건) / Threshold·SensorHealth(판정)로 사실상 3범주를 쓰지만 명시
      구분이 없다 — 우리 구조에선 범주를 드러낼지 결정해야 한다.
    tags: [operationaldata, 관측범주]

  - id: L-iso13374-osacbm
    kind: literature
    t: 2026-08-10
    by: CC
    status: relevant
    source:
      title: "ISO 13374 / MIMOSA OSA-CBM 상태감시 6블록"
      authors: "ISO / MIMOSA"
      year: 2012
      venue: "ISO 13374 series, OSA-CBM"
      url: "https://www.mimosa.org/mimosa-osa-cbm/"
    claim: >-
      상태감시 시스템을 6블록으로 규정 — Data Acquisition, Data Manipulation,
      State Detection, Health Assessment, Prognostic Assessment,
      Advisory Generation. OSA-CBM이 데이터 구조·스키마·인터페이스를 제공.
    relevance: >-
      KASMO의 SensorHealth·PredictiveMaintenance 서브모델이 이 계층. 두 칸의 경계를
      6블록 어디서 자를지로 정할 수 있다.
    tags: [건전성, 예지보전]

  - id: L-idta-published-list
    kind: literature
    t: 2026-08-10
    by: CC
    status: relevant
    source:
      title: "IDTA 발행 서브모델 템플릿 25종 목록"
      authors: "IDTA"
      year: 2026
      venue: "admin-shell-io/submodel-templates (published)"
      url: "https://github.com/admin-shell-io/submodel-templates"
    claim: >-
      Technical Data / Digital Nameplate / Contact Information / MTP /
      Provision of Simulation Models / Software Nameplate / DEXPI /
      Asset Interface Description / Control Component Type·Instance /
      Functional Safety / Handover Documentation / Hierarchical Structures
      enabling BoM / Reliability / Sizing of Power Drive Trains /
      Time Series Data / Service Request Notification / Carbon Footprint /
      Wireless Communication / Capability Description / Asset Interfaces
      Mapping Configuration / Data Retention Policies / Provision of 3D Models /
      Workstation Worker Matching Data 등 25종이 published.
    relevance: >-
      OperationalData에 해당하는 IDTA 표준 템플릿이 목록에 없다. Time Series Data
      (시계열 저장 형식)와 Asset Interface Description(통신 인터페이스)이 인접할 뿐
      "설비가 지금 어떤 상태이고 오늘 얼마나 돌았나"를 담는 표준 칸은 없다.
    takeaway: "일반화 설계가 실제로 필요한 곳은 OperationalData — TechnicalData는 표준 골격을 채우는 문제."
    tags: [idta, 범위확정]

  # ---------------- 실측 발견 ----------------
  - id: F-kosmo-4-required-sm
    kind: finding
    t: 2026-08-10
    by: CC
    status: active
    claim: >-
      국내 사업(2025 중소벤처기업부 과제공고 기준) AAS 모델 체크리스트가 필수 서브모델
      4종을 명시한다 — Identification, Technical Data, Operational Data,
      Documentation. TechnicalData·OperationalData만 일반화 대상으로 삼는 것은
      이 제도적 요구와 일치한다(나머지 둘은 IDTA 표준 템플릿이 그대로 채움).
    basis: >-
      kasmo_후보데이터.zip / 전해도금조_체크리스트.xlsx / 시트 'AAS Model Checklist'
      항목 5(중요도 필수). 같은 시트가 idShort 명명규칙·IRDI 실재성·ConceptDescription
      매핑도 필수로 강제.
    related: [{type: supports, ref: L-idta-technicaldata}]
    tags: [범위확정, kasmo]

  - id: F-kasmo-operational-skeleton
    kind: finding
    t: 2026-08-10
    by: CC
    status: active
    claim: >-
      KASMO 후보데이터 설비 3종(도금두께측정기·전해도금조·에칭장비)의 OperationalData가
      동일한 6~7블록을 공유한다 — PresentTime/Timestamp, BatchData(Setting·WorkOrder·
      ProductionPlan·ProductProductionLog·EnergyData 포함), Threshold, OperatingMode
      (ControlType·PresentOperationMode·AlarmCode·AlarmCodeDescription 4항목이 3종
      동일), ProductionOperatingLog, ActualDataMonitoring(EquipmentState + 모듈별),
      SensorHealth. 설비 특화는 전부 모듈(구성품) 이름으로만 들어가고 블록 자체는
      바뀌지 않는다. 서브모델 목록 자체도 4종이 거의 동일.
    basis: >-
      .aasx 4종 직접 파싱(aas.xml 트리 덤프, 2026-08-10). 예외는 표면처리기 — 서브모델
      이름이 OperationData(단수)이고 내부가 블록 없이 Property 30개 평면 나열이라
      이전 세대로 판단, 뼈대 참조 시 제외 대상.
    related: [{type: supports, ref: L-opcua-machinery-bbb}]
    tags: [kasmo, operationaldata, 뼈대]

  - id: F-kasmo-technical-pattern
    kind: finding
    t: 2026-08-10
    by: CC
    status: active
    claim: >-
      KASMO TechnicalData는 IDTA 5칸 중 GeneralInformation·ProductClassifications·
      FurtherInformation을 손대지 않고 그대로 쓰고, TechnicalPropertyAreas 자리만
      자체 이름(EquipmentSpecification)으로 대체해 '설비 전체 정격 + 모듈별 제원'
      두 층으로 쪼갠다. 단위 정의 컬렉션이 별도로 존재.
    basis: ".aasx 파싱 — 도금두께측정기·에칭장비 TechnicalData/2/0 트리 비교"
    related: [{type: based-on, ref: L-idta-technicaldata}]
    tags: [kasmo, technicaldata]

  - id: F-kasmo-naming-drift
    kind: finding
    t: 2026-08-10
    by: CC
    status: active
    claim: >-
      같은 사업 산출물 안에서도 뼈대를 문서로 못박지 않으면 이름이 갈린다 —
      단위 정의 컬렉션이 도금두께측정기는 ModelInternalApplicationUnit,
      에칭장비는 BaseUnitSetting인데 담는 내용(Time/Temperature/Humidity/Current/
      Voltage/Pressure/Flowrate Unit)은 사실상 같다.
    basis: ".aasx 파싱 2종 비교 — 동일 사업·동일 TechnicalData/2/0 버전"
    related: [{type: supports, ref: F-kasmo-technical-pattern}]
    tags: [kasmo, 실패사례, 용어]

  - id: F-smt-operational-divergence
    kind: finding
    t: 2026-08-10
    by: CC
    status: active
    claim: >-
      우리 SMT 8종(Loader/SPI/ScreenPrinter/Mounter/AOI/Reflow/Unloader/AgingTest)의
      OperationalData는 공통 블록이 하나도 없다 — 8종 8색(Feeds·Heads·LogLots·PcbLogs /
      BarCode·LotTracking·PCBInfo·InspectionData / PCBBarcodes / ArrayData / DataID /
      DeviceStatus·PortStatus·PoEPower … ). 벤더 로그 형식을 그대로 서브모델로 옮긴
      상태여서 설비가 늘 때마다 구조가 하나씩 는다. 한편 TechnicalData는 8종 전부
      IDTA 골격 그대로이고 TechnicalPropertyAreas 하위가 비어 있어 설비 제원이 실제로는
      들어가 있지 않다. 반면 자체 서브모델 MCF는 8종 공통으로 잘 일반화돼 있다.
    basis: "aas_data/SMT/SMT_AAS.zip 8종 .aasx 직접 파싱(2026-08-10)"
    related: [{type: compares-to, ref: F-kasmo-operational-skeleton}]
    tags: [smt, 현황진단]

  - id: F-generalization-principles
    kind: finding
    t: 2026-08-10
    by: CC
    status: active
    claim: >-
      둘 이상의 표준이 독립적으로 같은 답을 낸 일반화 원리 5가지 —
      (1) 최상위 블록은 얕게 고정하고 설비 차이는 구성품 축으로 흡수
      (OPC UA §10·11, MTConnect Device→Component, KASMO 모듈별 SMC),
      (2) 정적 제원은 구조가 아니라 semanticId로 일반화(IDTA 02003, KASMO 체크리스트),
      (3) 상태·모드는 자유 문자열이 아닌 상태기계(PackML, OPC UA §12·13, SEMI E10),
      (4) 시간·실적은 정의된 시간 모델 위에(ISO 22400-2, SEMI E10, OPC UA §14),
      (5) 관측값은 3범주로 — 연속 측정/이산 사건/상태 판정(MTConnect, ISO 13374).
    basis: >-
      본 조사 표준 7종 교차 대조 + KASMO 실측 3종 일치 확인.
      정리 문서: docs/설비AAS_일반화구조_레퍼런스조사.md
    related:
      - {type: based-on, ref: L-opcua-machinery-bbb}
      - {type: based-on, ref: L-state-models}
      - {type: based-on, ref: L-iso22400-time}
      - {type: based-on, ref: L-mtconnect-dataitems}
      - {type: based-on, ref: L-idta-technicaldata}
    tags: [설계원리]

  # ---------------- 제안 (사람 확인 대기) ----------------
  - id: D-adopt-kasmo-skeleton
    kind: decision
    t: 2026-08-10
    by: user
    status: reversed
    decision: >-
      OperationalData 일반화 뼈대로 KASMO 3종 공통 블록을 채택하되, 각 블록을 국제
      표준에 정렬시킨다(OperatingMode→PackML/OPC UA 상태기계, ProductionOperatingLog→
      ISO 22400-2 시간 요소, ActualDataMonitoring/Threshold→구성품 축 + MTConnect
      3범주, SensorHealth→ISO 13374). TechnicalData는 IDTA 5칸을 유지하고
      TechnicalPropertyAreas 안쪽만 '설비 전체 정격 / 모듈별 제원 / 단위 정의' 3절로
      고정한다.
    reason: >-
      국내 심사 체크리스트(F-kosmo-4-required-sm)와 국제 표준(F-generalization-
      principles)이 요구하는 바가 이 조합에서 동시에 만족된다. KASMO 뼈대는 국내
      사업 산출물 3종에서 실증된 형태이고, 표준 정렬은 대외 연동 시 의미 보증을 준다.
    scope: "TechnicalData·OperationalData 두 서브모델에 한함. Identification·Documentation은 IDTA 템플릿 그대로."
    related:
      - {type: based-on, ref: F-kasmo-operational-skeleton}
