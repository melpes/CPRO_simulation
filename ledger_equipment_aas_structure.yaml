  - id: L-iec81346-aspects
    kind: literature
    t: 2026-08-10
    by: CC
    status: relevant
    source:
      title: "IEC 81346-1:2022 산업 시스템 구조화 원칙 및 참조지정"
      authors: "IEC"
      year: 2022
      venue: "IEC 81346-1:2022"
      url: "https://standards.iteh.ai/catalog/standards/iso/a791f443-0be9-45e9-a209-9253c9259789/iec-81346-1-2022"
    claim: >-
      시스템 구조를 관점(aspect)별로 나눈다 — 기능(무엇을 하는가), 제품(무엇인가),
      위치(어디 있는가), 유형. 같은 대상이 관점에 따라 다르게 분해되며, 하나의 기능이
      여러 위치에 걸치거나 여러 기능이 같은 위치를 참조할 수 있다. 원칙은 '관점 하나를
      고르라'가 아니라 '어느 관점의 구조인지 밝히라'이다. IDTA 02011에도 IEC 81346 기반
      확장이 있다.
    relevance: >-
      "제습기 물통은 구성품인가 설비인가"가 애매한 이유의 표준적 설명 — 모델링 실수가 아니라
      관점 미지정 상태. AAS는 자산의 디지털 표현이므로 제품 관점을 기본으로 잡으면,
      판정 기준이 '이 물건이 무엇인가'에서 '이 값을 어떻게 쓸 것인가'로 옮겨간다.
    takeaway: >-
      3단 판정으로 실무화 — 값이 하나·추적 불필요면 설비 property, 여러 벌이거나 유닛 단위
      추적이면 CoManagedEntity, 독립 자산이면 SelfManagedEntity. 애매하면 낮은 쪽에서
      시작하고, 한 프로젝트 안에서는 같은 종류를 같은 단으로 다룬다.
    related: [{type: supports, ref: L-aas-entity-bom}]
    tags: [구성품축, 경계판정, iec81346]

  - id: D-toplevel-subject-axis
    kind: decision
    t: 2026-08-10
    by: CC
    status: provisional
    decision: >-
      TechnicalData·OperationalData의 최상위 분할 축을 '누구의 값인가'(설비 전체 / 구성품)로
      잡고, 그 아래에서 '무엇에 관한 값인가'(주제 절)로 가른다. 구성품 절의 각 유닛 SMC는
      AssetRef(ReferenceElement, 0..1)를 두어 SelfManagedEntity면 그 AAS를 가리키고
      CoManagedEntity면 값을 직접 담는다. 두 서브모델이 같은 유닛 키를 공유해
      '유닛 A의 정격'과 '유닛 A의 관측값'이 한 경로로 이어지게 한다.
      깊이 상한은 설비 레벨 4단, 구성품 레벨 +1단(총 5)으로 R5를 대체한다.
    reason: >-
      주제 축을 최상위에 두면(안 2) 유닛 하나의 정보가 7~8개 절에 흩어져 교체·보전 추적이
      불가능하다(F-8box-fails-process-equipment의 (다) 문제). 구성품 사양이 과반인
      공정장비에서는 주체 축 우선이 맞다.
    scope: "TechnicalPropertyAreas 하위 및 OperationalData 최상위"
    related:
      - {type: based-on, ref: L-aas-entity-bom}
      - {type: based-on, ref: F-8box-fails-process-equipment}
    tags: [최상위구조, 확인대기]

  - id: D-smt-baseline-absorb-kosmo
    kind: decision
    t: 2026-08-10
    by: user
    status: active
    decision: >-
      설비 AAS의 서브모델 구성은 SMT 설비 현행 구성(TechnicalData·OperationalData·
      Identification·DigitalNameplate·Documentation·CAD·MCF)을 기본으로 하고, KOSMO 자료에
      있고 우리에게 없는 서브모델은 그 내용을 TechnicalData·OperationalData 안에 넣을 수
      있으면 넣는다. 서브모델을 새로 늘리지 않는다. 표준 정합성은 흡수한 property에 원
      템플릿의 semanticId를 붙여 유지한다(IDTA 02066의 ISO22400-2 네임스페이스,
      IDTA PredictiveMaintenance, IDTA 02031, ECLASS/IEC CDD).
    reason: >-
      SMT 설비 SM 구성을 기준으로 삼기로 했고, SM 수를 늘리면 관리·조회가 복잡해진다.
      IDTA 02003-2-0이 '구조는 도메인이 정하고 의미는 외부 사전을 참조하라'는 원칙이므로
      구조를 자체로 두고 semanticId만 표준에서 가져오는 것은 표준 위반이 아니다.
      KOSMO도 PredictiveMaintenance의 RemainingUsefulLifePrediction에 IDTA semanticId를
      그대로 달아 같은 방식을 쓰고 있다(실측 확인).
    scope: "설비 AAS 서브모델 구성 전반. §6·§8.3·§10.5의 '별도 SM으로 뺀다' 서술을 대체."
    related:
      - {type: supersedes, ref: L-idta-pvm-02066}
      - {type: based-on, ref: L-idta-technicaldata}
    tags: [서브모델구성, 확정, 방침]

