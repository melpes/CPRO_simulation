  # ---------------- 2차 조사 (구조 규율) ----------------
  - id: L-idta-v2-layering
    kind: literature
    t: 2026-08-10
    by: CC
    status: relevant
    source:
      title: "IDTA 02003-2-0 v2.0 §2.1 구조 규정 및 §3.5 TechnicalPropertyAreas/Section 표"
      authors: "IDTA"
      year: 2025
      venue: "IDTA Submodel Template v2.0 (2025-03 발행) 원문 PDF"
      url: "https://raw.githubusercontent.com/admin-shell-io/submodel-templates/main/published/Technical_Data/2/0/IDTA%2002003_Template_TechnicalData.pdf"
    claim: >-
      TechnicalPropertyAreas는 SML(0173-1#02-ABK163#002)이고 원소 SMC의 semanticId
      설명이 "Specific property area referenced by a product classification" —
      area의 분할 축은 제품 분류이며 ProductClassifications의
      ReferenceToTechnicalPropertyArea가 연결한다. area 안의 Section은 SMC이며
      semanticId가 https://admin-shell.io/SMT/General/Arbitrary 하나로 통일, idShort는
      임의, Section 안에 Section 재귀 허용(깊이 제한 없음). v1.2의 MainSection/SubSection
      이원 구분은 v2.0에서 단일 Section으로 통합돼 사라졌다. 본문은 "This structure is
      therefore domain specific and shall be defined by domain specific specifications"라
      명시한다.
    relevance: >-
      "설비마다 어떤 건 수평으로 늘어놓고 어떤 건 깊게 판다"는 문제에 대한 표준의 답 —
      표준은 깊이·이름을 정하지 않고 도메인 명세에 위임한다. 즉 우리가 만들 배치 규율이
      표준이 요구하는 산출물 그 자체다. 표준이 주는 유일한 구조적 구속은 area 축(제품 분류)뿐.
    takeaway: "area=제품분류 축(표준), Section=주제 축(우리가 정함), 깊이 상한도 우리가 정함."
    tags: [technicaldata, 계층규율]

  - id: L-idta-agv-sections
    kind: literature
    t: 2026-08-10
    by: CC
    status: relevant
    source:
      title: "IDTA 02047-1-0 Technical Data for AGV in Intralogistics"
      authors: "IDTA"
      year: 2025
      venue: "IDTA Submodel Template (2025-03)"
      url: "https://industrialdigitaltwin.org/wp-content/uploads/2025/03/IDTA-02047-1-0-Submodel_Technical-Data-for-AGV.pdf"
    claim: >-
      IDTA가 발행한 설비 도메인 TechnicalData 정본 예시. GeneralInformation은
      02003-2-0을 그대로 재사용하고, 설비 특화 데이터는 전부 SML SpecificDescriptions의
      SMC #00 아래에 둔다. 그 아래 절: DataSheet(File), TypeAndApplicationInformation,
      TechnicalParameters, VDA5050Factsheet, Energy(하위 Battery),
      CommunicationAndControl, Safety, TemporaryTechnicalData, CurrentAttachments,
      ProprietaryConfigurationOptions. 각 절은 자체 IRI semanticId를 가진다.
    relevance: >-
      설비별 확장의 표준 경로는 최상위 칸 신설이 아니라 SpecificDescriptions/Section이라는
      실증. 또한 출처 있는 절 이름 공급원 — Energy, CommunicationAndControl, Safety,
      TypeAndApplicationInformation, TemporaryTechnicalData를 우리 절 이름 후보로 쓸 수 있다.
    takeaway: >-
      TemporaryTechnicalData의 존재가 중요 — 설비 고유 불변 사양과 설치 현장에 따라
      달라지는 값을 같은 절에 섞지 않는 IDTA식 해법.
    gap: "유지보수 절과 설치 환경조건 절은 AGV에 없어 이름 출처가 없다."
    tags: [technicaldata, 절이름, 사례]

