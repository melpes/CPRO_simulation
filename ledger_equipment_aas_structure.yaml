      주제 절은 두 부류로 갈린다 — 공통 절(설비가 무슨 일을 하든 같은 질문이 성립하고 담기는
      property도 대체로 같음: 에너지·유틸리티·설치환경조건·안전·보전신뢰성·통신제어)과
      가변 절(질문은 공통이나 property가 설비 기능마다 완전히 다름: 성능·대상물재료·유형용도).
      공통 절은 이름과 property 목록까지 고정 가능, 가변 절은 이름만 고정. SMT 7종 실측
