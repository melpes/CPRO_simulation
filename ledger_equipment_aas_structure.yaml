  - id: F-structure-applied-two-equipment
    kind: finding
    t: 2026-08-10
    by: CC
    status: active
    claim: >-
      설계 구조로 Mounter(SMT 표면실장기)와 DryEtcher(반도체 건식식각 챔버)의 TechnicalData·
      OperationalData를 실제로 작성한 결과 두 설비의 최상위 절이 동일해졌다(tech 10절,
      oper 8절). 빈 칸은 구조 불일치가 아니라 원본 자료에 값이 없어서다.
      작성 과정에서 설계 수정 3건이 나왔다 — (1) Units·Utilities·History는 SML로 두면
      basyx가 AASd-120으로 거부한다(SML 자식은 idShort 금지). 유닛을 이름으로 찾아야
      tech·oper 키 연결이 성립하므로 이름 있는 집합은 SMC여야 한다. (2) 유닛 안에 유닛을
      중첩하면(EtchingChamber>ESC) 깊이 5를 넘으므로 평탄 나열 + IsPartOf로 계층을 표현한다.
      (3) 단위 정의 칸(KOSMO BaseUnitSetting)은 불필요 — 단위는 property의 semanticId·
      valueType이 지정한다. 또 KOSMO 파일 안에서 tech의 Rectifier·VacuumPump가 oper에서는
      Powersupply·VacuumPumpMotor로 되어 있어 정격과 관측을 이을 수 없었다(유닛 키 공유가
      필요한 이유의 실물 증거). KOSMO Threshold는 제조사 고정 운전 한계이므로 tech의
      Units>OperatingLimits로 옮겼다.
    basis: >-
      docs/설비AAS_구조안_예시/{Mounter_new.json(127 property), DryEtcher_new.json(332 property)}
      생성 + basyx read_aas_json_file 검증 통과(각 3 objects). 매핑 근거는 같은 폴더 README.md.
    related:
      - {type: supports, ref: D-toplevel-subject-axis}
      - {type: supports, ref: F-layering-rules}
    tags: [적용예시, 검증, basyx]

  - id: F-entity-range-and-subsections
    kind: finding
    t: 2026-08-10
    by: CC
    status: active
    claim: >-
      2차 작성에서 구조 오류 4건을 고쳤다 — (1) 구성품을 SMC + Property("EntityType")로 만든 것은
      틀렸다. AAS 메타모델에 Entity SubmodelElement가 있고 entityType은 그 요소의 속성이며,
      AASd-014에 따라 SelfManagedEntity는 globalAssetId(또는 specificAssetIds) 필수·
      CoManagedEntity는 금지다. (2) SelfManagedEntity의 globalAssetId가 곧 그 구성품 자산에
      대한 참조이므로 별도 ReferenceElement(AssetRef)는 중복이다. (3) 구성품 계층은 평탄
      나열 + IsPartOf 대신 Entity 중첩으로 표현하고(IDTA 02011 EntryNode>Node 방식),
      깊이 증가는 운전 한계를 Range SME(min/max)로 바꿔 상쇄한다 — 별도 OperatingLimits 절이
      사라지고 관측값(Property)과 한계값(Range)이 요소 타입으로 구분된다.
      (4) 한 절에 성격이 다른 것이 섞이면 하위 절로 가른다 — EnvironmentalSpecifications를
      PhysicalCharacteristics(설비 자체 제원) / AmbientRequirements(설치 장소 요구) /
      Emissions(주변 방출)로, Energy를 ElectricalSupply(공급 조건) / PowerRating(소비 정격)으로.
      절 이름 3건 변경 — Units→MachineComponents(kW 등 측정 단위와 혼동, OPC UA 40001-1 §11
      용어), Energy→EnergySupply, EnvironmentalSpecifications→InstallationAndEnvironment.
    basis: >-
      사용자 지적(2026-08-10) + AAS 메타모델 v3 Entity 스펙(aas-core-meta) + basyx Entity 시그니처
      확인. 재생성 후 basyx 검증 통과(Mounter 121 property, DryEtcher 218 property).
    related: [{type: supersedes, ref: F-structure-applied-two-equipment}]
    tags: [적용예시, entity, 구조수정]

  - id: D-classification-not-property-template
    kind: decision
    t: 2026-08-10
    by: user
    status: active
    decision: >-
      이 작업의 산출물은 property 목록을 미리 채운 템플릿이 아니라 '분류 골격'이다.
      property 목록은 기존 설비 AAS의 것을 그대로 쓰고, 정하는 것은 그것들을 위에서부터
      어느 축으로 나눠 어느 절에 넣을지의 기준이다. 골격 파일에는 절만 두고 property 는
      0개로 한다.
    reason: >-
      "prop는 미리 만들어두지 말고, 지금하는작업은 prop들 리스트는 기존과 동일한데
      그걸 어떤 관점에서 위에서부터 분류할지를 좀 정하는거임"(사용자). property 를 골격에
      박아두면 설비마다 안 쓰는 칸이 남고, 정작 필요한 판정 기준은 드러나지 않는다.
