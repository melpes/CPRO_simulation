  - id: F-smt-section-drift
    kind: finding
    t: 2026-08-10
    by: CC
    status: active
    claim: >-
      우리 SMT 7종은 이미 area 1개 + Section 수평 나열 구조를 쓰고 있으나 절 이름과 배치가
      설비마다 다르다. 2개 이상 설비에 공통 등장하는 property 26개 중 13개가 서로 다른 절에
      배치돼 있다 — PowerConsumption(5종 EnvironmentalSpecifications vs Mounter·Reflow
      EnergyEfficiency), MeanTimeToRepair(3절로 분산), MESIntegration(SystemIntegration vs
      ConnectivityAndIntegration), PCBThicknessRange(3절), CycleTimeSec(7종 모두 성능 절이나
      절 이름이 7종 7색). 원인 넷: (가) 절 이름이 설비 종속, (나) 한 절에 축이 둘 섞임
      (EnvironmentalSpecifications가 '소비하는 것'과 '요구하는 조건'을 함께 담음),
      (다) 기준 없는 잡동사니 절 AdvancedFeatures, (라) 결합 절 SafetyAndReliability.
    basis: >-
      aas_data/*.json 7종 TechnicalPropertyAreas 파싱 후 property→절 역매핑
      (2026-08-10). SMT_AAS.zip보다 aas_data/*.json이 최신이며 zip 쪽은 areas가 비어 있음.
    related: [{type: supersedes, ref: F-smt-operational-divergence}]
    tags: [smt, 현황진단, 절불일치]

  - id: F-kasmo-template-violations
    kind: finding
    t: 2026-08-10
    by: CC
    status: active
    claim: >-
      KASMO 산출물의 구조 결함 7건 실측 — (1) 4종 중 3종이 TechnicalPropertyAreas
      (0173-1#02-ABK163#002)와 SpecificDescriptions(0173-1#02-ABM221#001)를 삭제하고
      자체 SMC EquipmentSpecification·단위 컬렉션을 최상위에 신설(표면처리기만 템플릿 준수),
      (2) 단위 컬렉션 이름이 설비 간 불일치, (3) 자체 IRI semanticId가 'Https://'(대문자 H)로
      3종 공통 오타 — 자기네 체크리스트의 IRI 양식 항목 위반, (4) Identification(HSU 구식
      스키마)과 Nameplate(IDTA v3) 정보 중복, (5) DataSource와 AssetInterfacesDescription
      역할 중복, (6) Threshold·Setting이 성격상 TechnicalData/ProcessParameters인데
      OperationalData에 있음, (7) EquipmentSpecification 아래 낱개 속성·주제 절·구성품 절이
      같은 계층에 혼재. property 어휘(ElectricitySpecification, EquipmentSize 등)는 재활용
      가능하나 구조는 채택 대상이 아니다.
    basis: ".aasx 4종 semanticId 포함 파싱 + IDTA 02003-2-0 원문 대조 (2026-08-10)"
