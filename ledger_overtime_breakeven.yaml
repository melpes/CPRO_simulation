  - id: F-due-compliance-as-benefit-proxy
    kind: finding
    t: 2026-07-17
    by: CC
    status: active
    claim: >-
      화폐화된 이익 데이터가 없는 상황에서, 데이터로 뒷받침되는 유일한 정량 "생산량
      증가의 이득" 대리지표는 납기 준수율이다 — CPRO_3모델_생산데이터_정리.md §7:
      완료일정 있는 70건 중 납기 준수 35건(50%). 초과근무로 그날 정규시간 내 못
      채운 물량을 소진하면 이 준수율이 올라갈 여지가 있다. 단, 이 효과는 "그날 자재가
      실제로 남아있었는가"에 전적으로 좌우된다 — 같은 문서 §9의 자재병목 실측(VD7
      200대 PO "생산가능 0", NVD1 42대 자재상한)에서 보듯 자재가 없는 날엔 초과근무를
      해도 완성 물량이 늘지 않는다. 즉 "생산량 증가=이득"은 무조건 성립하는 게 아니라
      "그날 자재가 남는 조건"에서만 성립하는 조건부 이득이다.
    basis: >-
      CPRO_3모델_생산데이터_정리.md §7(납기 준수 통계) × §9(자재병목 실측) 직접 대조.
    related:
      - {type: based-on, ref: F-no-price-margin-data-found}
      - {type: supports, ref: O-comparison-frame}
      - {type: supports, ref: O-marginal-output-per-ot-hour}
