      발견되지 않았다(원문 재확인 필요) — 다만 이건 생산 데이터가 아니라 계약 조건
      성격이라 CPRO 측에 직접 문의하면 확보 가능성이 있다.

  - id: F-revenue-weighted-breakeven-formula
    kind: finding
    t: 2026-07-17
    by: CC
    status: active
    claim: >-
      개별 기업의 이익률·단가·지체상금 데이터를 요구하지 않고도 "생산성 증가율 vs
      전기비용 증가율"을 정규화해 비교할 수 있다 — 단가 불변을 가정하면 생산성
      증가율≈매출 증가율이므로, 손익분기 조건 "매출증가분 ≥ 전기비용증가분"을
      전개하면 매출×생산성증가율 ≥ 전기비용×전기비용증가율, 즉
      "생산성증가율 ≥ (전력비/매출 비중) × 전기비용증가율"이 된다. 유일하게 필요한
      추가 정보는 "전력비가 매출에서 차지하는 비중"이며, 이는 재무제표에서 바로
      나오는 값(또는 업종 평균치 대체 가능)이라 개별 계약 조건보다 훨씬 일반화하기
      쉽다. 예: 전력비 비중 1%·전기비용증가율 80%(F-breakeven-productivity-ratio의
      피크요율 프리미엄)면 필요 최소 생산성증가율은 0.8%로 매우 낮은 문턱 — 조립형
      제조업처럼 전력비 비중이 낮은 업종일수록 초과근무가 기업 손익 관점에서
      이득 쪽으로 기울 가능성이 크다.
    basis: >-
      매출=단가×수량 항등식 전개(단가 불변 가정) × 손익분기 조건(매출증가분≥비용증가분)
      — 순수 대수적 도출, 회귀·통계 검증 대상 아님. 전제: 생산량 증가분이 실제
      매출로 실현됨(수요 미포화, 즉 수주 대비 공급부족 상태) — CPRO는
      F-due-compliance-as-benefit-proxy(수주잔량·납기지연 50%)로 이 전제가 뒷받침됨.
    related:
      - {type: compares-to, ref: F-breakeven-productivity-ratio}
      - {type: based-on, ref: F-due-compliance-as-benefit-proxy}
      - {type: raises, ref: O-electricity-revenue-share}

