  - id: F-cpro-electricity-revenue-share-estimate
    kind: finding
    t: 2026-07-17
    by: CC
    status: active
    claim: >-
      CPRO 베트남 2024년 연간 전력사용량 793,013 kWh(F-cpro-monthly-kwh-2024)에
      개략 블렌디드 요율(전압등급·시간대 세부 구분 없이 약 1,800 VND/kWh로 근사,
      L-tariff-1279-current·L-tariff-2699-prev 범위 내)을 곱하면 연간 전기비용
      약 14억 VND. 2026-07 환율(L-fx-vnd-2026-07, 1,000VND≈57.3원)로 환산하면
      약 8,000만원(시점 불일치 — 2026년 환율을 2024년 금액에 적용). ㈜씨프로 2024년
      연결매출 370억원(L-cpro-korea-parent-revenue) 대비 전력비 비중은 **약 0.2%**.
      F-revenue-weighted-breakeven-formula에 대입하면 필요 최소 생산성증가율
      ≈ 0.2% × 80%(F-peak-premium-ratio-stable의 피크요율 프리미엄) ≈ **0.16%** —
      거의 0에 가까운 문턱. 이 추산이 자릿수 하나 정도 틀리더라도(비중이 실제
      1~2%라 해도) 필요 문턱은 여전히 1% 안팎에 불과해, "전기비용이 매출 대비
      워낙 작아 기업 손익 관점에서는 초과근무 생산량 증가가 거의 항상 전기비용
      증가를 압도한다"는 자릿수 수준의 결론은 비교적 견고함.
    basis: >-
      F-cpro-monthly-kwh-2024(실측 kWh) × 개략 블렌디드 요율 가정 ×
      L-fx-vnd-2026-07(환율, 시점 불일치 주의) × L-cpro-korea-parent-revenue
      (그룹 연결매출, 베트남 단독 기여분 아님) × F-revenue-weighted-breakeven-formula.
      네 겹의 근사·불확실성이 누적돼 있어 자릿수(order of magnitude) 수준으로만
      신뢰할 것 — 정밀치 아님.
    related:
      - {type: based-on, ref: F-cpro-monthly-kwh-2024}
      - {type: based-on, ref: L-cpro-korea-parent-revenue}
      - {type: based-on, ref: F-revenue-weighted-breakeven-formula}
      - {type: based-on, ref: F-peak-premium-ratio-stable}
