mode: review
entries:
  - id: F-shift-end-meets-peak
    kind: finding
    t: 2026-07-17
    by: CC
    status: active
    claim: >-
      CPRO 시뮬레이션 기준 근무시간(aas_data/AssemblyByWorker.json DefaultParameters)은
      WorkStartTime 09:00 / WorkEndTime 18:00 / 점심(BreakDurationMin) 12:00~13:00로
      고정돼 있다. 베트남 전기 피크 시간대(결정 963/QĐ-BCT, 월~토 17:30~22:30, 일요일 없음)와
      겹쳐 보면 정규 근무 마지막 30분(17:30~18:00)이 이미 피크 요금대에 걸리고, 18:00 이후
      모든 추가근무 시간은 전량 피크 요금(보통 대비 전압등급별 약 1.80~1.87배, 결정
      1279/QĐ-BCT)으로 청구된다.
    basis: >-
      DVP-납품-부품-및-해당-부품-사용하는-모델-파악/aas_data/AssemblyByWorker.json
      (WorkStartTime/WorkEndTime/BreakDurationMin 값, 2026-07-17 확인) ×
      ledger_vietnam_electricity.yaml#L-tou-963-timebands, #L-tariff-1279-current.
    related:
      - {type: based-on, ref: "ledger_vietnam_electricity#L-tou-963-timebands"}
      - {type: based-on, ref: "ledger_vietnam_electricity#L-tariff-1279-current"}
      - {type: raises, ref: O-factory-kv-tier}
      - {type: raises, ref: O-marginal-output-per-ot-hour}

  - id: O-factory-kv-tier
    kind: open
    t: 2026-07-17
    by: CC
    status: open
    question: >-
      공장이 4개 전압등급(110kV 이상 / 22~110kV / 6~22kV / 6kV 미만) 중 어디에 해당하는지
      확정 필요 — 등급에 따라 피크 단가가 3,266~3,640 VND/kWh로 갈린다(약 11%p 차이).
      KETI-81(CPRO 월 전기 사용량 데이터 기반 공장 kV 추정하기) 쪽에서 실측 월별 kWh와
      설비 정격용량은 확보됐으나(ledger_vietnam_electricity#F-cpro-monthly-kwh-2024),
      계약전압 자체는 원본자료 어디에도 기재가 없다. 설비 정격용량(약 268kW, EVNNPC
      저압망 재평가 문턱값 40kW의 6배 이상)과 CPRO 전용건물 확인(세입자-저압분전
      시나리오 배제)이 결합하면서 "6kV~22kV 미만"(계량점이 자체 변압기 1차측이면
      "22kV~110kV 미만") 쪽으로 추정이 강화됨
      (ledger_vietnam_electricity#F-cpro-voltage-tier-estimate-v2). 다만 "6kV 미만"
      가능성도 완전히 배제되지 않아 여전히 정황 추론 — 전기 고지서·전력공급계약서의
      "Cấp điện áp" 항목 원문 확인 전까지 미확정. 이 값 없이는 요율표의 어느 행을 쓸지
      못 정해 전기비용 실수치 산정 전체가 막힌다.
    related:
      - {type: depends-on, ref: "ledger_vietnam_electricity#F-cpro-voltage-tier-estimate-v2"}
      - {type: depends-on, ref: "ledger_vietnam_electricity#F-cpro-monthly-kwh-2024"}

  - id: O-marginal-output-per-ot-hour
    kind: open
    t: 2026-07-17
    by: CC
    status: answered
    question: >-
      18:00 이후 1시간 추가근무가 실제로 생산량을 얼마나 늘리는지(시간당 한계생산량) 아직
      없음. 지금까지의 실행 기록은 전부 WorkEndTime=18:00 고정판이고, 연장 시나리오(예:
      WorkEndTime→22:30)로 돌린 기록은 없음 — run_trained.py가 WorkStartTime/WorkEndTime
      오버라이드를 지원하므로 실행 자체는 가능하다. 단, 다른 트랙의 선행 발견(셀-RL PoC:
      처리율 병목은 노동이 아니라 자재)이 이번 시나리오 조건에도 유효하다면, 근무시간을
      늘려도 자재 공급이 그대로면 생산량이 비례해서 늘지 않을 수 있음 — 이 전제부터
      재확인 필요. 이 값 없이는 생산성 증가분 산정 전체가 막힌다.
      → 2026-07-19 실험(OT-TRADEOFF-earliness-vs-toucost)으로 q180 시나리오에 한해
      답 확보: 한계생산량 0 (F-overtime-zero-benefit-q180). 다른 PO 규모·자재제약
      조건은 미답.
    related:
      - {type: answers, ref: F-overtime-zero-benefit-q180}

  - id: F-overtime-zero-benefit-q180
    kind: finding
    t: 2026-07-19
    by: CC
    status: active
    claim: >-
      사전등록 실험 OT-TRADEOFF-earliness-vs-toucost(15 runs: 종업시각 5레벨 ×
      seed 3) 결과, q180(A60/B60/C60)·고정정책 조건에서 초과근무 연장(18:00→22:30)의
      완료 앞당김은 정확히 0이다 — 15회 전 run의 makespan이 1.562847일로 소수점
      6자리까지 동일. 원인 두 가지: ① MODEL_A(day0 16:26)·MODEL_C(day0 14:00)는
      정규시간 내 완료라 저녁에 남는 일감 자체가 없고, ② 전체 makespan은 MODEL_B의
      본드 경화 24h(벽시계 대기)가 임계경로라 노동시간 연장으로 단축 불가.
      반면 전기비용은 연장 1시간당 +35,080 VND(공장 기저전력 10kW × 피크요율
      3,508 VND/kWh)로 단조 증가, 전 레벨 CI가 0 배제(separated). 즉 이 시나리오의
      구조는 "트레이드오프(무릎)"가 아니라 "이득 0·비용만 증가"의 퇴화형 —
      계약 verdict=fails(C2 이득 체감 위배: 체감할 이득 자체가 없음).
      함의: 초과근무가 이득이 되려면 (a) 저녁까지 일감이 남는 주문 규모이거나
      (b) 임계경로가 노동시간인 조건이어야 하며, q180은 둘 다 아니다. 이는
      F-breakeven-productivity-ratio의 1.8배 문턱 논의보다 앞선 0차 조건이다.
    basis: >-
      contract_overtime_tradeoff.yaml(OT-TRADEOFF-earliness-vs-toucost, completed,
      2026-07-19 잠금·실행) — raw: exp_overtime/overtime_sweep.json, 그래프:
      exp_overtime/overtime_tradeoff.png. 에너지 적분은 시뮬 자체 3계정 집계와
      15/15 일치 검증. 통계: boot_diff_ci 비용 증가 전 레벨 separated,
      makespan은 분산 0의 exact.
    related:
      - {type: based-on, ref: F-shift-end-meets-peak}
      - {type: answers, ref: O-marginal-output-per-ot-hour}
      - {type: contradicts, ref: F-breakeven-productivity-ratio}
      - {type: supports, ref: F-due-compliance-as-benefit-proxy}

  - id: F-overtime-q540-permodel-earliness
    kind: finding
    t: 2026-07-19
    by: CC
    status: active
    claim: >-
      사전등록 실험 OT-TRADEOFF-q540-earliness-vs-toucost(q540=A180/B180/C180,
      15 runs) 결과 — q180과 달리 저녁 백로그가 실재해 초과근무 시간에 조립이 실제로
      돌았고(피크대 소비 120→447 kWh), 모델별 완료는 크게 앞당겨졌다:
      MODEL_C −15.4h(19시 연장만으로 day1 오전→day0 저녁 완료, 이후 추가 연장은
      효과 0으로 포화), MODEL_A −1.6~−6.1h(연장할수록 점증), MODEL_B 불변.
      그러나 PO 전체 완료(makespan)는 −0.8분~+5.0분으로 실질 0 — MODEL_B의 본드
      경화 24h가 임계경로여서 B가 믹스에 있는 한 전체 기준 이득은 규모를 키워도
      생기지 않는다. 비용은 +219,247(19시)~+609,606(22:30) VND로 q180의 4배 —
      기저전력만이 아니라 "내일 아침 보통요율에 했을 조립"이 오늘 저녁 피크요율로
      옮겨진 대체효과가 지배. 계약 verdict=fails(C2: 전체 makespan 기준 체감할
      이득 없음). 종합 함의: "이득"의 정의가 결론을 가른다 — ① PO 전체 완료 기준
      이득 0·비용만 증가(손해), ② 모델별 출하 시점 기준 실질 이득 존재(특히 C의
      19시 1시간 연장이 15.4h를 사는 최고 효율 지점, 그 이상 연장은 C엔 무효).
      또한 무릎 구조: C 기준으로는 19시가 명확한 무릎(1시간에 15.4h, 이후 0).
    basis: >-
      contract_overtime_tradeoff_q540.yaml(completed, 2026-07-19) — raw:
      exp_overtime/overtime_sweep_q540.json, 그래프:
      exp_overtime/overtime_tradeoff_q540.png. 에너지 3계정 적분-집계 일치 15/15,
      비용 증가 전 레벨 boot_diff_ci separated, 모델별 완료는 seed 분산 거의 0.
    related:
      - {type: based-on, ref: F-overtime-zero-benefit-q180}
      - {type: supports, ref: F-due-compliance-as-benefit-proxy}
      - {type: raises, ref: O-benefit-definition-scope}

  - id: O-benefit-definition-scope
    kind: open
    t: 2026-07-19
    by: CC
    status: open
    question: >-
      KETI-82 손익분기 판단에서 "생산성 증가 이득"을 무엇으로 정의할지 결정 필요 —
      (a) PO 전체 완료(makespan) 기준: B 경화가 임계경로라 초과근무 이득 0, 결론은
      "초과근무 손해". (b) 모델별 출하 가능 시점 기준: C −15.4h·A −6.1h의 실질
      이득 존재, 19시(1시간 연장)가 효율 무릎. (c) 납기 임박 모델만 선별 연장 등
      운영 정책 차원. 두 실험(q180·q540)이 공통으로 보여준 것: 이 정의 선택이
      손익분기 결론 자체를 뒤집는다. 사람 결정 필요.
    related:
      - {type: depends-on, ref: F-overtime-q540-permodel-earliness}

  - id: O-value-per-unit
    kind: open
    t: 2026-07-17
    by: CC
    status: open
    question: >-
      생산량 증가분을 전기비용(VND)과 같은 화폐 단위로 비교하려면 완성품 단위당 판매가·
      이익 데이터가 필요하다. 현재까지 확보된 생산 자료(3모델 생산성·납기 조사)는 생산성·
      납기 실측치뿐이고 단가·이익 데이터는 확인된 바 없음. 손익을 금액(원화/VND) 기준으로
      비교하는 경우 전체가 이 값에 막힌다 — 물량 대 kWh(에너지효율) 기준으로만 비교한다면
      불필요.

  - id: F-peak-premium-ratio-stable
    kind: finding
    t: 2026-07-17
    by: CC
    status: active
    claim: >-
      4개 전압등급(110kV 이상/22~110kV 미만/6~22kV 미만/6kV 미만) 전부에서 피크/보통
      요율비를 직접 나누면 1.80~1.85로 거의 동일하다(110kV 이상 3266/1811=1.80,
      22~110kV 3398/1833=1.85, 6~22kV 3508/1899=1.85, 6kV 미만 3640/1987=1.83).
      즉 공장 전압등급이 아직 미확정(O-factory-kv-tier)이어도 "18:00 이후 시간당
      전기비용이 정규시간 대비 몇 배인지"는 등급과 무관하게 약 1.8배로 사실상 고정된다.
    basis: >-
      ledger_vietnam_electricity#L-tariff-1279-current의 4개 전압등급별 보통/피크
      단가를 직접 나눈 산술(외부 검증 불필요 — 이미 3-0 검증된 요율표의 단순 사칙연산).
    related:
      - {type: based-on, ref: "ledger_vietnam_electricity#L-tariff-1279-current"}
      - {type: raises, ref: F-breakeven-productivity-ratio}

  - id: F-breakeven-productivity-ratio
    kind: finding
    t: 2026-07-17
    by: CC
    status: active
    claim: >-
      이익·단가 데이터 없이도 "단위 생산량당 전기비용"으로 정규화하면 비교가 성립한다.
      시간당 전력사용량이 정규시간·초과근무 동일하다고 가정하면, 초과근무 단위당
      전기비용 ÷ 정규시간 단위당 전기비용 = (피크요율/보통요율) × (정규시간
      시간당생산량/초과근무 시간당생산량) ≈ 1.8 × (정규시간 시간당생산량/초과근무
      시간당생산량). 이 비율이 1이 되는 손익분기 조건은 "초과근무 시간당 생산량 ≥
      정규시간 시간당 생산량 × 약 1.8"(80% 이상 더 생산해야 순수 전기비용 관점에서
      손해를 안 봄). 22:30 이후로 초과근무가 이어지면 그 구간은 보통요율로 복귀해
      평균 프리미엄이 1.8배보다 낮아진다. 이 결론은 시간당 전력사용량이 정규/초과
      동일하다는 가정 위에 있으며(O-marginal-output-per-ot-hour 미해결로 실측 검증
      전), 다른 트랙 선행발견(셀-RL PoC: 처리율 병목=노동 아닌 자재)이 유효하다면
      초과근무 시간당 생산량이 정규시간과 같거나 낮을 가능성이 있어 1.8배 문턱
      충족이 낙관적이지 않을 수 있다.
    basis: >-
      F-peak-premium-ratio-stable(요율비 산술) × 단위경제 정규화(단가 데이터 불필요한
      비율 전개) — 시간당 전력사용량 동일 가정은 명시적 전제이며 미검증.
    related:
      - {type: based-on, ref: F-peak-premium-ratio-stable}
      - {type: depends-on, ref: O-marginal-output-per-ot-hour}
      - {type: answers, ref: O-comparison-frame-status}

