id:           OT-TRADEOFF-earliness-vs-toucost
status:       completed
registered_at: "2026-07-19"
claim_type:   existence
topic:        초과근무 손익분기
goal: >-
  초과근무 종료시각을 18:00에서 22:30까지 늘릴 때, 이득(완료 앞당김)은 체감하고
  비용(TOU 가중 전기비용)은 계속 증가하는 트레이드오프 구조(무릎 지점)가
  존재하는가 — KETI-82의 "생산성-전기비용 손익분기"를 시뮬레이션 시나리오로 검증.
criterion:
  - "C1(비용 단조증가): TOU 가중 전기비용(VND, seed 평균)이 종료시각 인접 레벨 전 구간(18→19→20→21→22.5)에서 단조 증가한다"
  - "C2(이득 체감): 시간당 한계 앞당김(레벨 간 Δmakespan ÷ Δ연장시간, seed 평균)이 첫 증분(18→19) 대비 마지막 증분(21→22.5)에서 더 작다"
assumptions:
  - "이득은 '완료 앞당김(일)'로 정의 — 납기 대비 지각이 아니라 baseline(18:00 종료) 대비 makespan 감소. 앞당김의 화폐가치 환산은 범위 밖(ledger O-delay-penalty-value)"
  - "시뮬은 요일을 구분하지 않으므로 전 일자를 평일(월~토, 피크 있음)로 가정 — 일요일 무피크 효과 미반영"
  - "정책은 18:00 종료 조건에서 학습된 고정 정책 — 연장 조건에서 재학습하지 않음(현행 운영방식 유지 가정)"
  - "요율은 6~22kV 구간 사용 — 피크/보통 비율(≈1.8)은 전압등급 불변이므로 무릎 위치 결론은 등급 무관(ledger F-peak-premium-ratio-stable)"

setup:
  sim: "KG/keti/CPRO_조립공정/시뮬레이션/Package (현행 코드, AAS: 에이징3h·공장기저10kW)"
  scenario: "schedule (PO 완주)"
  po: "MODEL_A 60 / MODEL_B 60 / MODEL_C 60, due_day 3 (q180 due3 관례)"
  tariff: "결정 1279/QĐ-BCT 6~22kV: 보통 1,899 / 피크 3,508 / 심야 1,234 VND/kWh (VAT 제외)"
  timebands: "결정 963/QĐ-BCT: 피크 17:30~22:30, 심야 00~06, 나머지 보통"
  energy_attribution: "기저=근무창 10kW, 조립=이벤트 구간에 정격전력 균등, SMT=배치 실적립 kWh를 배치 시간창에 균등 — 3계정 모두 시뮬 자체 집계와 일치 검증(smoke, 오차 0)"

reference:
  kind: node
  ref: "self-baseline (work_end_hour=18.0 레벨이 스윕 내 기준선)"

factors:
  - {name: work_end_hour, role: test,    levels: [18.0, 19.0, 20.0, 21.0, 22.5]}
  - {name: po,            role: control, value: "A60/B60/C60 due3"}
  - {name: policy_ckpt,   role: control, value: "result/runs/q180s__q540val-300ep/agent_mod.pt (고정)"}
  - {name: tariff_tier,   role: control, value: "6~22kV"}
  - {name: work_start,    role: control, value: "09:00 (점심 12~13시 고정)"}
  - {name: seed,          role: random,  distribution: "seeds 0-2", n: 3}

determinism:  stochastic
method: >-
  exp_overtime/overtime_tou_driver.py — run_trained.TrainedModel로 각 (종료시각, seed)
  조합을 1회 완주. makespan·모델별 완료시각·TOU 대역별 kWh·VND 비용 산출.
  레벨별 seed 평균과 bootstrap CI(stats.py boot_ci/boot_diff_ci), 한계 앞당김은
  인접 레벨 차분.
trials:       15
proxy_for: null
# 주의: 이 계약의 claim은 (앞당김, 비용) 곡선의 구조 자체 — 둘 다 직접 측정.
# '앞당김→기업 이득' 화폐화는 별도 하류 질문으로 범위 밖(assumptions 참조,
# ledger F-due-compliance-as-benefit-proxy · O-delay-penalty-value).

