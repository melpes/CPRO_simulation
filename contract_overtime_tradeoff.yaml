comparison: >-
  C1 충족 — 비용은 전 구간 단조 증가(전량 기저전력 10kW의 피크대 노출: 시간당
  +35,080 VND = 10kW × 3,508). C2 위배 — 한계 앞당김이 전 구간 정확히 0(첫 증분
  0, 마지막 증분 0, 체감 구조 자체가 없음). 원인: ① MODEL_A(day0 16:26)·
  MODEL_C(day0 14:00)는 정규시간 내 완료라 저녁에 남는 일감이 없고, ② 전체
  makespan은 MODEL_B의 본드 경화 24h(벽시계 대기, DepWaitSec)가 임계경로라
  노동시간 연장으로 단축 불가. 트레이드오프(무릎)가 아니라 "이득 0·비용만
  증가"의 퇴화 구조.

verdict:      fails
