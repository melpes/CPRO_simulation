mode: review
entries:
  - id: L-gmaps-dvp-cpro-tou
    kind: literature
    t: 2026-07-15
    by: CC
    status: relevant
    source:
      title: "Google Maps 경로·시간대별 소요시간 조회 — DVP(Tử Dương, Yên Mỹ, Hưng Yên) → CPRO(Paperlab, Văn Môn/Đông Thọ, Yên Phong, Bắc Ninh)"
      authors: "Google Maps 교통 예측(typical 범위)"
      year: 2026
      venue: "maps.google.com (2026-07-15 조회, 출발시간 지정 샘플링)"
      url: "https://www.google.com/maps/dir/?api=1&origin=T%E1%BB%AD+D%C6%B0%C6%A1ng,+Y%C3%AAn+M%E1%BB%B9,+H%C6%B0ng+Y%C3%AAn&destination=Paperlab+Vi%E1%BB%87t+Nam,+V%C4%83n+M%C3%B4n,+Y%C3%AAn+Phong,+B%E1%BA%AFc+Ninh&travelmode=driving"
    claim: >-
      경로 후보 3개 — ① ĐCT Hà Nội-Hải Phòng/CT04/QL5B 경유 48.9~49.6km(최속·유료),
      ② 같은 축에서 ĐCT Bắc-Nam Phía Đông/CT01/QL1A 분기 48.9~49.6km(①과 동급, ±5분),
      ③ Cao Tốc Hà Nội-Thái Nguyên/CT07 경유 57.0km(항상 +10~15분 열위).
      평일(목 2026-07-16) 출발시간별 최속 경로 typical 소요시간:
      05:00 → 50분~1시간5분 / 07:30 → 55분~1시간15분 / 09:00 → 55분~1시간15분 /
      12:00 → 50분~1시간10분 / 15:00 → 55분~1시간15분 / 17:30 → 55분~1시간15분 /
      19:00 → 55분~1시간15분 / 22:00 → 50분~1시간10분.
      일요일(2026-07-19) 09:00 → 55분~1시간15분(평일과 동일).
      실시간 조회(수 13:40경 현지시간) 58분.
    relevance: >-
      ③ 물류 발주 최적화 시나리오의 운송 시간축 파라미터. 핵심 관찰: 이 구간은
      시간대 민감도가 작다 — 출발시간에 따른 typical 범위 이동이 ±5~10분에 불과하고,
      어느 시간대든 범위 폭(±20분, 50~75분)이 그보다 크다. 즉 출발시간 최적화 레버는
      편도 10분 수준이며, 소요시간 불확실성(하한~상한) 관리가 더 중요.
      경로가 하노이 도심을 통과하지 않고 동부 우회(고속도로+QL18 축)라 도심 정체
      영향이 제한적인 것으로 보임.
    caveat: >-
      승용차 기준 예측 — 화물차(트럭) 통행 제한·중량 제한·저속은 미반영이라
      실제 트럭 운송 시간은 더 길고 시간대 제약이 있을 수 있음(O-truck-restrictions).
      Google 'typical' 범위는 과거 교통 패턴 기반 추정치이고 우기·명절(뗏) 변동 미반영.
      출발지 Tử Dương은 Google이 'Lý Thường Kiệt, Yên Mỹ'로 지오코딩 — DVP 정확한
      공장 위치와 수 km 오차 가능.
    related:
      - {type: raises, ref: O-truck-restrictions}

  - id: O-truck-restrictions
    kind: open
    t: 2026-07-15
    by: CC
    status: answered
    question: >-
      이 경로(CT04 하노이-하이퐁 고속도로, 하노이 동부 우회, QL18/QL1A 축)에
      화물차 통행 제한(하노이 시간대별 트럭 금지·중량 제한)이 걸리는 구간이 있는지,
      있다면 어느 시간대에 우회·대기가 필요한지 — deep-research 검증 진행 중
      (러시아워 시간대·옌퐁 공단 국지 정체 포함).
    related:
      - {type: answers, ref: F-truck-route-implication}

  - id: L-hanoi-truck-ban-2026
    kind: literature
    t: 2026-07-15
    by: CC
    status: relevant
    source:
      title: "하노이시 결정 01/2026/QĐ-UBND — 도심 화물차 통행 제한 (2026-01-15 시행)"
      authors: "하노이 인민위원회 (2026-01-04 공포)"
      year: 2026
      venue: "법령 DB thuvienphapluat 해설 + Dân trí·VnExpress 보도"
      url: "https://thuvienphapluat.vn/hoi-dap-phap-luat/quy-dinh-cam-xe-tai-vao-noi-thanh-tp-ha-noi-tu-ngay-1512026-ra-sao-138077700.html"
    claim: >-
      2026-01-15부터 하노이 도심 제한구역 내: 총중량 2톤 이상 일반 화물트럭은
      21:00~다음날 06:00에만 운행 가능(주간 금지). 2톤 미만은 피크시간 외 운행 가능.
      피크시간 공식 정의(제2조) = 매일 06:00~09:00, 16:00~19:30. 예외 운행은 서면
      승인제(2~10톤: 시 공안, 10톤 이상: 건설국). 제한구역 경계는 3환도로(Vành đai 3)
      안쪽 도심 — 3환도로 자체·바깥 통과 경로는 제한구역 밖.
    relevance: >-
      DVP→CPRO 경로는 하노이 도심 제한구역을 통과하지 않으므로(동부 우회) 이 금지의
      직접 대상 아님. 다만 '하노이권 공식 피크 = 06~09시, 16~19:30'이라는 시간 프레임과
      '도심 물류는 21시~06시 심야 창구'라는 제도 환경은 ③ 물류 시나리오의 시간축 설계에
      직접 쓰임. 검증 3-0 다수(관련 클레임 9건).
    caveat: >-
      제한구역 경계 세부(경계도로 자체의 취급)는 해설 기사 기반 — 결정문 원문 지도
      확인 전까지 경계 인접 구간은 보수적으로 볼 것.

  - id: L-vd3-pilot-2026q1
    kind: literature
    t: 2026-07-15
    by: CC
    status: relevant
    source:
      title: "하노이 3환도로(Vành đai 3) 고가 피크시간 대형트럭 진입 제한 시범 (2026 Q1)"
      authors: "하노이 건설국(Sở Xây dựng) 발표, ANTV·VOV Giao thông·Tiền Phong·24h 보도"
      year: 2026
      venue: "베트남 교통 전문 매체·공안방송 보도 교차"
      url: "https://vovgiaothong.vn/newsaudio/tu-01-1-2026-ha-noi-thi-diem-han-che-oto-tai-tren-10-tan-vao-vanh-dai-3-gio-cao-diem-d49409.html"
    claim: >-
      2026-01-01~03-31 시범: 총중량 10톤 이상 트럭·컨테이너·트랙터는 피크시간에
      3환도로 고가부(일부 방향·구간) 및 탕롱대로·QL32의 3환 진입 방향 통행 제한.
      피크 시간대는 소스별로 06:00~09:00/16:00~20:00(ANTV·24h) 또는
      06:30~09:00/16:30~19:30(VOV)으로 보도가 갈림. 배경: 3환 고가는 설계용량
      15,000 PCU/일 대비 실측 5~6만 대/일(약 5배 과포화). 시범 후 지속 여부 미정.
      시행 초기 진입로 피크 정체는 뚜렷이 감소했다는 보도.
    relevance: >-
      10톤 이상 대형 트럭·컨테이너로 운송할 경우에만 우리 경로에 걸릴 수 있는 제한.
      단 시범 구간은 고가부(남서측 Mai Dịch~Pháp Vân 축) 중심이고 우리 동부 통과
      구간(Thanh Trì교 축) 포함 여부는 미확인(O-route-vd3-detail). 피크 회피
      (09~16시 또는 20시 이후 출발) 설계면 안전.
    caveat: >-
      피크 정의가 보도별로 30분~어긋남. 3개월 시범이라 2026-04 이후 효력 미정 —
      조사 시점(2026-07)에 연장/정식화 여부는 검증 안 됨. 일부 검증 에이전트에
      안전분류기 미가동 주석 있음(내용은 복수 매체 교차로 유지).

  - id: L-ql5-phonoi-bottleneck
    kind: literature
    t: 2026-07-15
    by: CC
    status: relevant
    source:
      title: "QL5 흥옌 Phố Nối 구간 상습 정체 보도 (2025-11)"
      authors: "Tiền Phong (흥옌성 교통경찰 인용)"
      year: 2025
      venue: "현지 언론 실측 보도"
      url: "https://tienphong.vn/quoc-lo-5-qua-hung-yen-thuong-xuyen-un-tac-hang-cay-so-post1799137.tpo"
    claim: >-
      QL5 흥옌 Phố Nối 구간은 하노이→하이퐁 방향 수 km 정체가 이틀 연속 발생하는 등
      상습 정체(2025-11 실측). 18:30까지 정체 지속 사례. 교통경찰이 지목한 기제:
      교통량 증가 + QL5-Lạc Đạo역 진입로·Phố Nối 교차로에서 공단 진입 좌회전
      화물차·컨테이너가 직진 차로를 차단. 전부 3-0 검증.
    relevance: >-
      DVP(Yên Mỹ) 출발 직후 초입이 Phố Nối 생활권 — 경로가 QL5 본선을 짧게라도
      경유하거나 교차하면 이 병목의 영향권. '공단 진입 화물차가 병목을 만든다'는
      기제는 CPRO 쪽 옌퐁 공단 진입부에도 유사 적용 가능성. Google typical 범위의
      상한(+20분)이 이런 국지 이벤트를 반영하는 것으로 해석 가능.

  - id: L-cauho-ql38
    kind: literature
    t: 2026-07-15
    by: CC
    status: tangential
    source:
      title: "QL.38 Cầu Hồ 교차로(박닌 Tiên Du) 정체 보도"
      authors: "VOV Giao thông"
      year: 2025
      venue: "교통 전문 라디오 보도"
      url: "https://vovgiaothong.vn/newsaudio/cau-ho-bac-ninh-quoc-lo-tac-hon-ca-noi-do-d30343.html"
    claim: >-
      하노이 우회 대안 축(QL.38, 흥옌→박닌)의 Cầu Hồ 교차로는 08시경과 15~16시경
      거의 항상 정체.
    relevance: >-
      하노이를 완전히 우회하는 QL.38 동측 대안 경로를 검토할 경우의 병목 정보.
      Google 최속 경로에는 미포함이라 주변 참고.
    caveat: >-
      검증 투표 1-1(검증자 1명 세션 한도로 사망) — 다른 클레임(2-1~3-0)보다 근거 약함.

  - id: F-truck-route-implication
    kind: finding
    t: 2026-07-15
    by: CC
    status: active
    claim: >-
      DVP→CPRO 운송의 시간대 제약은 차량 등급이 결정한다 — ① 승용차/2톤 미만:
      Google 실측대로 시간대 민감도 작음(전 시간대 50~75분, 피크 효과 +5~10분).
      ② 2톤 이상 일반 트럭: 하노이 도심 제한구역만 피하면 됨 — 우리 동부 우회 경로는
      비대상이라 영향 제한적. ③ 10톤 이상·컨테이너: 3환도로 고가 피크 제한(2026 Q1
      시범, 06~09시·16~20시)에 걸릴 수 있어 피크 회피 출발(09~16시 또는 20시 이후)이
      안전. 공통 리스크: 출발지 초입 QL5 Phố Nối 병목(공단 진입 화물차 기제)과
      도착지 옌퐁 공단 진입부 유사 병목 — 시간대와 무관하게 상한 +20분 여유 필요.
    basis: >-
      Google Maps 시간대 샘플링(L-gmaps-dvp-cpro-tou) × 하노이 트럭 제한 제도
      (L-hanoi-truck-ban-2026, L-vd3-pilot-2026q1) × QL5 병목 실측 보도
      (L-ql5-phonoi-bottleneck). deep-research 확정 클레임 25건(3-0 다수) 기반.
    related:
