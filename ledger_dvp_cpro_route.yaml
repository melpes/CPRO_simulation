  - id: O-vd3-after-q1
    kind: open
    t: 2026-07-15
    by: CC
    status: open
    question: >-
      3환도로 고가 대형트럭 피크 제한 시범(2026-01-01~03-31)이 그 후 연장·정식화
      됐는지 — 조사 시점(2026-07) 기준 후속 결정 미검증. 정식화됐다면 10톤+ 운송의
      피크 회피가 상시 제약이 됨.

  - id: O-route-vd3-detail
    kind: open
    t: 2026-07-15
    by: CC
    status: answered
    question: >-
      Google 최속 경로의 하노이 동부 통과 구간이 3환도로 고가부(시범 제한 구간)를
      실제로 쓰는지, 아니면 Thanh Trì교~QL1A 지상부만 쓰는지 — 경로 세부(세부정보
      패널) 확인 필요. 대형 컨테이너 운송 설계 시 확정할 것.
    related:
      - {type: answers, ref: F-vd3-not-on-route}

  - id: F-vd3-not-on-route
    kind: finding
    t: 2026-07-16
    by: CC
    status: active
    claim: >-
      DVP→CPRO 최속 경로는 하노이 서남측의 3환도로 고가부(Vành đai 3 trên cao)·
      탕롱대로·QL32(대형트럭 피크 제한 시범 대상 전부)와 도심 제한구역(2톤 이상 주간
      금지 구역)을 모두 통과하지 않는다. 실 경유: DVP → ĐT379 북상(Văn Giang) →
      ĐCT Hà Nội-Hải Phòng(CT04) 짧은 서측 구간 → Cổ Linh(롱비엔) → 하노이-박장
      (QL1A) 축 북상 → Từ Sơn/Đại Đồng → ĐT295 → Đông Thọ 공단. 전 구간 홍강 동안
      (같은 강안)이라 도강 없음. 따라서 현행 제도 기준 모든 트럭 등급이 전 시간대
      법적으로 통행 가능.
    basis: >-
      Google Maps 경로 지도 판독(2026-07-16, 11z + 확대 스크린샷 — 세부정보 패널은
      UI 문제로 미확인). 제한 구간 목록은 L-vd3-pilot-2026q1(고가부·탕롱대로·QL32)·
      L-hanoi-truck-ban-2026(제한구역 경계=3환 안쪽 도심)과 대조. 지도 판독 기반이라
      확신도 중간 — 10톤+/컨테이너 실 운송 계약 전 운송사에 경유지 확인 권장.
