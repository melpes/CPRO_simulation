  - id: O-tet-rainy-variation
    kind: open
    t: 2026-07-15
    by: CC
    status: open
    question: >-
      우기·뗏(설) 명절의 소요시간 변동 폭 — deep-research에서 해당 각도 클레임이
      검증을 통과하지 못해 미확인. 연간 시뮬레이션에 계절 변동을 넣으려면 별도 조사 필요.
