  - id: L-thaco-3p5t-7t-classes
    kind: literature
    t: 2026-07-17
    by: CC
    status: relevant
    source:
      title: "Thaco Ollin/Forland 3.5~7톤급 스펙 (S700/FD700/500/720)"
      authors: "Thaco 딜러 스펙 페이지"
      year: 2026
      venue: "xetaithaco24h.com / xetaithacohaugiang.com / xetaibaoloc.com / thacotaivinh.com / ototainghean.com"
      url: "https://www.xetaithaco24h.com/san-pham/xe-tai-ollin-500-mui-bat-tai-trong-4-95-tan/"
    claim: >-
      Ollin S700(3.5톤): 적재 3.49t, 적재함 4,350×1,950×1,850mm, 엔진 110Ps,
      연비 10~12L/100km. Forland FD700(3.5톤, 오픈형): 전체 5,910×2,310×2,790mm,
      적재함 3,800×2,140×665mm(5.41㎥). Ollin 500/500B(5톤): 적재 4.95t, Weichai
      3.8L 엔진 — 연비 수치는 확보 못함(gap). Ollin 720/S720(7톤): 적재 7t,
      적재함 6,200×2,190×780~2,150mm, Weichai YZ4DB1-40(4,087cc) 140Ps, 연비
      14~15L/100km.
    relevance: >-
      중간 차급(3.5~7톤) 후보 스펙트럼. 같은 3.5톤이라도 바디타입(밀폐 vs 오픈)에
      따라 적재함 부피가 3배 이상 차이 — 화물 특성(다이캐스팅 부품, 방수·도난
      우려)에 맞는 바디타입 선정이 필요함을 시사.
    gap: "5톤급(Ollin 500/500B) 연비 수치 미확보."
    caveat: "전부 딜러 판매 페이지 스펙 — 실도로 연비와 카탈로그 연비는 통상 괴리."

  - id: L-hino-300-series
    kind: literature
    t: 2026-07-17
    by: CC
    status: relevant
    source:
      title: "Hino 300 시리즈(Dutro 기반, 베트남 조립) 3.5~8.5톤급 스펙"
      authors: "Hino 딜러 스펙 페이지"
      year: 2026
      venue: "xetai-hino.vn / hino3svn.com / xehinovietnam.com.vn"
      url: "https://xetai-hino.vn/gia-xe-hino/xe-tai-hino-300-75-dutro-model-wu352-130mdl/"
    claim: >-
      XZU352L: 적재 3,450kg/총중량 7,300kg. XZU720L: 적재허용 3.5톤/총중량
      7,500kg. 밀폐 적재함(공통) 4,450×1,850×1,850mm. 연비: XZU650 9L/100km,
      XZU720 10.5L/100km.
    relevance: "일본계 대표 차급 — Thaco 대비 연비·내구성 비교군."
