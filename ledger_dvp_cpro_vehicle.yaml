  - id: F-fuel-source-reconciliation
    kind: finding
    t: 2026-07-17
    by: CC
    status: active
    claim: >-
      연비 데이터 3개 출처(딜러 스펙페이지·EcoTransIT 국제표준·베트남
      업계실무 정메)를 전 차급에서 교차 대조한 결과, 이 구체 차량들에 대한
      "신뢰할 만한 실측" 데이터는 사실상 없음 — 뚜렷한 패턴만 있음: ①
      1.5t~8t(소형~중형)에서는 딜러표기와 업계실무 정메가 서로 정합(예:
      3.5t 딜러10~12 vs 정메11, 7~8t 딜러14~15 vs 정메12)하고 EcoTransIT
      (GVW기반 밴드 추정)만 약 2배 높게 나옴 — 즉 이 구간에선 F-dealer-fuel-figures-unreliable
      의 "딜러 불신" 판정이 과했을 가능성. ② 15t(대형)에서는 반대로 업계
      실무(30)와 EcoTransIT(32.4)가 정합하고 딜러(10~13)만 확연히 낮아
      불신이 유지됨. 결론: 소형~중형은 EcoTransIT의 EU Euro VI 밴드가 실제
      베트남 소형트럭보다 무거운 차량군을 대표해 과대추정하는 것으로 보이고,
      대형(15t)에서만 EcoTransIT 밴드가 현실과 맞아떨어짐.
    basis: >-
      L-dinh-muc-fuel-benchmark × L-thaco-3p5t-7t-classes/L-hino500-isuzu-fseries-15t
      (딜러) × F-representative-fuel-per-class(EcoTransIT GVW보간) 3자
      직접 대조표(수치 산술 확인).
