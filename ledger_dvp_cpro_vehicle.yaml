  - id: F-fullload-tripcount-invariant
    kind: finding
    t: 2026-07-17
    by: CC
    status: active
    claim: >-
      적재율이 100%(풀)로 유지되는 한, "차량 수"와 "빈도"의 구체적 배분은
      총배출량에 영향이 없다 — 동일 총물동량·동일 차급 하에서 필요한 총
      왕복횟수는 (총물동량 ÷ 차량당 적재용량)으로 고정되며, 이를 트럭 1대가
      자주 달성하든 트럭 여러 대가 덜 자주 달성하든 총 주행거리·총
      연료소모·총배출량은 동일하다(예: 트럭 2대가 이틀마다 = 트럭 1대가
      매일, 둘 다 '일 1회 왕복'이라는 같은 총 운행률). F-frequency-affects-emissions
      의 ②번 메커니즘("총 왕복횟수=f(차량수,빈도)")은 표현이 부정확했음 —
      정확히는 총왕복횟수=f(총물동량, 적재율)이고, 차량수·빈도는 그 왕복횟수를
      어떻게 '조직'하느냐의 문제일 뿐 별도의 배출량 레버가 아니다. 배출량이
      실제로 달라지는 경우는 ① 적재율이 100% 밑으로 떨어질 때(연비 자체가
      나빠짐 + 필요 왕복횟수가 이론적 최소치보다 많아짐), ② 귀로 공차운행
      (왕복횟수에 비례) 뿐 — 이 둘 다 결국 "왕복횟수·적재율" 문제로 수렴한다.
      배출량의 진짜 레버는 ⓐ 차급 선택(대형일수록 t-km당 유리, 규모의 경제)과
      ⓑ 적재율(풀로 채워 보내는가) 두 가지뿐이고, "같은 차급 내 차량수·빈도
      배분"은 그 자체로는 중립적이다.
    basis: >-
      사용자 확인(2026-07-17) — "적재가 풀인 상태에서 두 차량이 이틀마다
      이동하냐 한 차량이 하루마다 이동하냐는 동일할 것 같다"는 지적. 배출량
      계산식(거리×연비×2.68, ledger_carbon_emission#F-carbon-calc-recommendation)에
      대입하면 총거리=총왕복횟수×98km이고 총왕복횟수=총물동량/적재용량(풀
      적재 가정)이라 차량수·빈도 배분과 무관하게 고정됨을 대수적으로 확인.
    related:
      - {type: supersedes, ref: F-frequency-affects-emissions}
      - {type: based-on, ref: F-frequency-affects-emissions}
      - {type: answers, ref: O-quantify-frequency-emissions}

  - id: F-dealer-fuel-figures-unreliable
    kind: finding
    t: 2026-07-17
    by: CC
    status: superseded
    claim: >-
      베트남 딜러 사이트 연비 수치는 국제표준(EcoTransIT)의 "공차(0%적재)"
      환산치보다도 낮은 경우가 3개 차급 모두에서 확인됨(전수 재검산,
      2026-07-17) — ① Thaco Ollin S700(3.5t) 딜러표기 10~12L/100km <
      EcoTransIT 3.5~7.5t밴드 공차 16.3L/100km. ② Thaco Ollin S720(7t)
      딜러표기 14~15L/100km < EcoTransIT 7.5~12t밴드 공차 17.7L/100km.
      ③ Hino 500 FL/FM(15t) 딜러표기 10~13L/100km < EcoTransIT 12~20t밴드
      공차 19.7L/100km. 셋 다 "짐을 하나도 안 실어도 이보다 더 쓴다"는
      모순 상태라 신뢰 불가. Hyundai Porter H150(1.5t, 딜러표기 8~12L/100km
      만재)는 EcoTransIT 최소 밴드(3.5~7.5t)보다 작은 차급이라 비교할 밴드가
      없어 미검증(신뢰 여부 불명, 불신 확정 아님). 이후 시나리오 계산
      (F-scenario-loadfactor-sweep-15t 등)은 딜러 수치 대신 EcoTransIT
      표준 밴드(공차/60%적재/만재, 3표 검증된 국제 물리량 기반)를 사용함 —
      3.5t는 3.5~7.5t밴드(5.8/6.4/6.8 MJ/km), 7t는 7.5~12t밴드(6.3/7.1/7.6
      MJ/km), 15t는 12~20t밴드(7.0/8.5/9.5 MJ/km)로 근사.
    basis: >-
      딜러 수치를 35.61 MJ/L(L-diesel-ef의 연료 물성치)로 MJ/km 환산해
      L-ecotransit-fuel-defaults 밴드(공차/60%/만재)와 전 차급 대상으로
      전수 대조 — 산술 확인(1.5t만 비교 밴드 부재로 제외).
