  - id: F-frequency-affects-emissions
    kind: finding
    t: 2026-07-17
    by: CC
    status: superseded
    claim: >-
      차급·적재중량(capa)을 고정해도 차량 수·운행빈도 선택에 따라 총
      탄소배출량은 달라질 여지가 크다. 메커니즘 3가지 — ① 적재율이 km당
      연비 자체를 바꿈(같은 차급이라도 공차/60%적재/만재 연비가 다름).
      ② 총 왕복횟수=f(차량수,빈도)가 배출량 계산식(거리×연비×2.68)의 거리
      총량을 직접 결정 — 완전적재로 왕복횟수를 최소화하면 총배출량 최소,
      물량을 잘게 나눠 자주 보내면(매번 덜 채운 채) 왕복횟수가 늘어 총배출량도
      는다. ③ 귀로 공차운행(backhaul 없음) — 빈도가 늘수록 빈 채로 도는
      구간의 총 km도 비례 증가. 즉 차급 선택뿐 아니라 같은 차급 안에서의
      적재율·왕복빈도 선택도 배출량의 실질 레버다.
    basis: >-
      ledger_carbon_emission#L-ecotransit-fuel-defaults(차급별 공차/60%/만재
      연비 차이) × ledger_carbon_emission#F-carbon-calc-recommendation(배출량=
      거리×연비×2.68 공식) × F-vehicle-count-frequency-table(차급별 왕복빈도) ×
      ledger_carbon_emission#O-shuttle-empty-run(귀로 공차 이슈) — 신규 조사
      아니라 기존 두 ledger의 결합 종합.
    related:
      - {type: based-on, ref: "ledger_carbon_emission#L-ecotransit-fuel-defaults"}
      - {type: based-on, ref: "ledger_carbon_emission#F-carbon-calc-recommendation"}
      - {type: based-on, ref: F-vehicle-count-frequency-table}
      - {type: based-on, ref: "ledger_carbon_emission#O-shuttle-empty-run"}
      - {type: raises, ref: O-quantify-frequency-emissions}

