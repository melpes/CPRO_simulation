      단 여러 독립 출처(업계 평균 range와 실지입기사 실측)가 서로 좁은
      범위로 수렴해 베트남 데이터보다는 훨씬 안정적. "공차/60%적재/만재"
      같은 하중별 구분은 없음(전부 "평균 운행" 기준) — 하중별 민감도
      분석이 필요하면 별도 가정(예: EcoTransIT형 곡선)을 얹어야 함.
      1.4t는 대응하는 실제 모델 구분이 없어 1t 수치를 그대로 준용(약간
      과소평가 가능성).
