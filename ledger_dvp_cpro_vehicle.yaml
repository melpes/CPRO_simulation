  - id: D-exclude-dvp-production-volume
    kind: decision
    t: 2026-07-17
    by: user
    status: active
    decision: >-
      DVP→CPRO 차급·적재량·이동빈도 산정에 DVP 생산량 실측(F-dvp-shipment-mass-modest,
      L-dvp-part-unit-weights)을 근거로 쓰지 않는다.
    reason: >-
      월평균(29,893 EA/월≈3.9톤)을 주 단위로 나눠 "차급 최소값도 주 1회
      운행으로 커버된다"고 결론낸 것이 성급했음 — 실제 생산은 하루
      1,000~1,500개 단위로 연속 발생하는데, 이를 일주일치씩 쌓았다가 한 번에
      수송한다는 전제 자체가 비현실적(그런 배치·저장 운영을 한다는 근거 없음).
      월 단위 평균으로 시간축을 압축하면 실제 배치·부피 구조가 가려짐 — 이
      집계 방식으로는 "며칠 주기로 몇 대"를 답할 수 없다. (사용자 확인,
      2026-07-17)
    scope: "KETI-83 — DVP→CPRO 차급·Capa·이동빈도 최적화 시나리오"
    related:
      - {type: contradicts, ref: F-dvp-shipment-mass-modest}
