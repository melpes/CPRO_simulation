  - id: L-dvp-part-unit-weights
    kind: literature
    t: 2026-07-17
    by: CC
    status: relevant
    source:
      title: "DVP 다이캐스팅 부품별 단위중량 및 월별 생산량 실측 (2024.07~2025.06)"
      authors: "에코앤파트너스(ESG 데이터 수집대행), CPRO/DVP 현장 제공"
      year: 2025
      venue: "DVP 20250819.xlsx, 시트 'Rawdata_제품생산량'"
      url: "C:\\Users\\KangTaehui\\KG\\keti\\CPRO_조립공정\\원본자료\\에코앤파트너스\\DVP 20250819.xlsx"
    claim: >-
      DVP가 생산하는 다이캐스팅 부품(전량 ADC12/ALDC12 알루미늄 합금) 82개
      품번의 개당중량(kg/EA)과 2024.07~2025.06 월별 생산량(EA)이 품번별로
      실측 기재돼 있음(데이터출처 'E COUNT' 표기, ERP 카운트 시스템으로 추정).
      개당중량 분포: 최소 0.001kg~최대 1.171kg, 중앙값 0.14kg — 즉 낱개는
      경량 소형부품(브래킷·케이스류)이 대부분. 월별 총 출하량: EA 기준
      15,577~45,568개(월평균 29,893개), 중량 기준 2,046.6~6,576.1kg
      (월평균 3,884.9kg). 연간 합계 358,718 EA / 46,619.2kg.
    relevance: >-
      DVP→CPRO 셔틀(F-vehicle-candidate-spectrum)의 "적재 가능 수량"을 실제로
      계산할 수 있게 하는 1차 데이터. 월평균 3.9톤/월(≈897kg/주, 22근무일
      기준 177kg/일)은 최소 후보 차급(1.5톤, 적재 1,500kg)의 적재중량보다도
      작아 — 이 노선은 초기 가정과 달리 중량(kg) 제약이 아니라 부피(㎥)·
      포장 효율 제약이 지배적일 가능성이 큼(O-dvp-packaging-volume).
    caveat: >-
      이 시트가 "DVP 총생산량"인지 "DVP→CPRO 출하량"인지 명시적 구분이
      없음 — DVP가 CPRO 외 타 고객사에도 납품하는지 미확인(회의록에선 DVP를
      CPRO 전용 협력사처럼 서술했으나 명시적 확인 아님). 0.001kg 최소값은
      다이캐스팅 부품치고 비정상적으로 작아 오탈자 가능성(이상치, 전체
      분포에 미치는 영향은 미미). 데이터 기간(2024.07~2025.06)이 route/전기
      ledger의 다른 실측치(2025~2026)와 시점이 달라 최신 수요와 다를 수 있음.
    related:
      - {type: supports, ref: F-vehicle-candidate-spectrum}
      - {type: answers, ref: O-dvp-cargo-unit-spec}
      - {type: raises, ref: O-dvp-packaging-volume}
      - {type: compares-to, ref: "ledger_vietnam_electricity#F-dvp-monthly-kwh-2024-reference"}

  - id: F-dvp-shipment-mass-modest
    kind: finding
    t: 2026-07-17
    by: CC
    status: superseded
    claim: >-
      DVP→CPRO 다이캐스팅 부품 중량 흐름은 월평균 약 3.9톤(주 약 0.9톤,
      영업일 기준 일 약 180kg)으로, 후보 차급 최소값(1.5톤 트럭, 적재중량
      1,500kg)조차 중량 기준으로는 주 1회 운행으로 여유 있게 커버 가능한
      규모다. 즉 KETI-83의 "이동 빈도·차량 수 최적화"는 중량 제약이 아니라
      ① 포장 부피(부품이 가볍지만 형상이 커 적재함 부피를 먼저 채울 가능성),
      ② 생산 스케줄과의 동기화(일단위 소량·다품종 82개 품번을 어떤 배치
      주기로 묶어 보낼지), ③ 왕복 공차운행(귀로 화물 유무) 이 세 축이
      지배 변수가 될 공산이 큼.
    basis: >-
