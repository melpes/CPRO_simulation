    source:
      title: "CPRO 작업표준서(VD7/BT5/NVD1) BOM 시트 — 완제품 유닛박스·카톤박스 실측 치수"
      authors: "CPRO 사내 작업표준서"
      year: 2026
      venue: "작업표준서\\VD7(...)Rev2.0.xlsx, BT5(...)Rev2.1.xlsx, NVD1(...)Rev1.0.xlsx — 각 'BOM' 시트"
