  - id: F-korea-truck-loadfactor-sensitivity
    kind: finding
    t: 2026-07-17
    by: CC
    status: active
    claim: >-
      한국 6개 차급(1t/1.4t/2.5t/5t/11t/25t)에 대해 "만재(100%) 대비
      적재율별 km당 연비 변화율(%)"을 산출 — 톤급이 클수록 적재율 변화에
      훨씬 민감함. 20%적재 시 100%대비: 1t~2.5t(3.5~7.5t밴드) -11.8%,
      5t(7.5~12t밴드) -13.6%, 11t(12~20t밴드) -21.1%, 25t(26~40t밴드)
      -33.6%. 50%적재 시: 1t~2.5t -7.4%, 5t -8.3%, 11t -13.2%, 25t -21.4%.
      원인: 소형트럭은 공차중량이 전체 무게의 대부분이라 적재량 변화가
      전체 무게에 주는 영향이 작고, 대형트럭은 적재량이 전체 무게에서
      차지하는 비중이 커서 적재율 변화의 영향이 훨씬 큼(대형차 오버사이징
      손해가 소형차보다 크다는 F-scenario-oversizing-penalty 계열 논의와
      같은 방향).
    basis: >-
      ledger_carbon_emission#L-ecotransit-fuel-defaults의 GVW밴드별 공차/
      60%/만재 MJ/km(신규 조사 아니라 기존 확정자료 재사용) × 이번 6개
      차급을 payload 기준으로 GVW밴드에 근사 매핑(1t/1.4t/2.5t→3.5~7.5t,
      5t→7.5~12t, 11t→12~20t, 25t→26~40t) × 구간별 선형보간. 단, GVW밴드
      매핑이 payload 기준 근사라 부정확 — 특히 1t~2.5t가 전부 같은 밴드로
      묶여 이 구간 내 차급간 구분이 약하고, 25t의 26~40t밴드 배정은 GVW
      추정치(약 41.7t, payload÷0.6)에 근거해 가장 불확실. EU 트럭의
      하중-연비 "형태"가 한국 트럭에도 그대로 적용된다는 가정도 미검증
      (O-korea-truck-loadshape-unverified).
