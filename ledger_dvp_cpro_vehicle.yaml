      GVW보정판 — 같은 물량·같은 빈도를 "큰 차량(15t, GVW실측24t) 50%적재"
      (73.10kgCO2e/trip) vs "중간 차량(7t, GVW추정14t) 100%적재"
      (73.36kgCO2e/trip)로 옮기면 **차이가 -0.4%(사실상 동률, 무시 가능)**
      — 이전 판(15t를 12~20t밴드로 잘못 배정해 산출한 +8.6% "오버사이징
      손해")은 밴드 오배정에 따른 결과였고, 15t의 실제 GVW(24t, 20~26t밴드)
      로 바로잡으면 그 손해가 사실상 사라진다. 즉 "대형차 50%적재가 중형차
      완전적재보다 확실히 나쁘다"는 이전 결론은 폐기 — 이 특정 비교(15t@50%
      vs 7t@100%)에서는 둘이 거의 동등하다. 다만 7t의 GVW는 추정치이고
      15t는 실측이라 비교의 신뢰도가 비대칭적(O-gvw-estimates-unverified) —
      7t 실제 GVW가 추정보다 낮으면(예: 12t) 12~20t밴드 안에서도 연비가
      낮아져 다시 "오버사이징 쪽이 나쁨" 방향으로 돌아갈 수 있음.
    basis: >-
      F-representative-fuel-per-class의 GVW기반 20~26t밴드(15t, 50%적재=
