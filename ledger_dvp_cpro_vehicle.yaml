      후보 차급 전부(1.5t/3.5t/7t/15t, 부피 데이터 있는 것만) 중량 여유보다
      부피 여유가 훨씬 작아 전부 "부피 제약"이 지배적이다 — 중량 기준 최대
      적재개수는 부피 기준의 약 9~12배(예: 1.5t 트럭 중량기준 11,542개 vs
      부피기준 1,296개). 즉 F-dvp-shipment-mass-modest(폐기됨)가 놓친 지점은
      "물동량이 크다"가 아니라 "차급 선택의 실질 제약은 무게가 아니라
      부피"라는 것.
