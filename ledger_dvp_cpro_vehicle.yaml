  - id: L-8ton-dump-gap
    kind: literature
    t: 2026-07-17
    by: CC
    status: tangential
    source:
      title: "8톤급 검색 결과 — 대부분 덤프트럭(xe ben), 박스형 화물차 스펙 미확보"
      authors: "Thaco/Isuzu 딜러 스펙 페이지"
      year: 2026
      venue: "xetaithacoansuong.com 등"
      url: "https://xetaithacoansuong.com/san-pham/xe-ben-thaco-8-tan/"
    claim: >-
      8톤급 검색 상위 결과는 Thaco Forland FD850/FD140, Isuzu FVR34 등 덤프트럭
      (xe ben) 위주. Forland FD850(덤프) 참고 스펙: 적재중량 7,820kg, 외형
      6,160×2,330×2,750mm, 적재함(덤프베드) 6.5㎥, 연료탱크 140L, Yuchai
      4,214cc 140Ps.
    relevance: >-
      8톤급이 실존 차급임은 확인되나, DVP→CPRO에 필요한 밀폐/박스형(thùng kín)
      8톤급 실제 모델·연비·적재함 치수는 이번 조사로 못 잡음.
    gap: "8톤급 박스형(비-덤프) 화물차 스펙 — 후속 조사 필요(O-8ton-box-spec)."
    related:
      - {type: raises, ref: O-8ton-box-spec}

