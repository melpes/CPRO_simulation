  - id: F-scenario-loadfactor-sweep-15t
    kind: finding
    t: 2026-07-17
    by: CC
    status: superseded
    claim: >-
      큰 차급(15t, 12~20t밴드 근사)에서 총물동량을 고정하고 적재율을
      100%→30%로 낮추며 왕복빈도로 보정하면, trip당 연비는 완만히 줄지만
      (100%→50%에서 9.50→8.25 MJ/km, -13%) 필요 왕복횟수는 반비례로 늘어
      (2.00배) 총배출량은 거의 선형에 가깝게 증가한다 — 50%적재 지점에서
      총배출 +73.7%, 30%적재에서 +171.9%(100%적재=기준 1.000). 결론: 적재율
      유지가 빈도 조절보다 배출량에 압도적으로 중요하다.
    basis: >-
      F-dealer-fuel-figures-unreliable의 EcoTransIT 12~20t밴드(7.0/8.5/9.5
      MJ/km, 공차/60%/만재)를 구간별 선형보간(정확히 선형 — 기울기 0.025
      MJ/km per 1%load로 3점 모두 일치 확인). 총배출=trips×거리×연비(km당),
      trips∝1/적재율. 거리=DAF보정 왕복 102.6km(51.3km×2,
      ledger_carbon_emission#F-carbon-calc-recommendation).
