mode: review
entries:
  - id: L-vn-truck-market-tiers
    kind: literature
    t: 2026-07-17
    by: CC
    status: relevant
    source:
      title: "베트남 상용차 시장 차급별 라인업 — Thaco(로컬 1위)·Hyundai(TC Motor)·Isuzu/Hino(법인 TCO)·중국계 신규진입"
      authors: "Astute Analytica 시장분석 + 딜러 스펙 페이지(xetaihanoi.edu.vn, thanhphongauto.com) 교차"
      year: 2026
      venue: "Vietnam Commercial Vehicle Market 리포트 + Thaco 딜러 공식 페이지"
      url: "https://www.astuteanalytica.com/industry-report/vietnam-commercial-vehicle-market"
    claim: >-
      Thaco(베트남 최대 로컬 제조사, 전문 상용차 시장 20~25% 점유) 차급 라인업 —
      Towner(750~990kg) / Frontier(1.49~2.5t) / Ollin(1.9~7t) / Forland(2.43~8t) /
      Foton·Auman(9.3~17t). Hyundai Porter H150/Mighty(TC Motor 조립, 판매 2위)·
      Isuzu·Hino(법인 물류 TCO 우위 세그먼트 장악)·중국계(Dongfeng·Howo·Foton,
      2024년부터 신규 진입) 확인. 2.5톤 또는 1.5톤 미만 차량은 도심 주간 통행
      예외 허용된다는 서술 있음.
    relevance: >-
      DVP→CPRO 차급 후보군의 시장 지도. 로컬(Thaco)=저가~중가, 일본계(Hino/Isuzu)=
      법인 TCO 우위라는 구도가 차급별 후보 압축의 1차 필터.
    caveat: >-
      "2.5톤 또는 1.5톤 미만 예외" 서술은 출처가 시장분석 요약이라 정확한 톤수
      경계·법령 근거는 미상 — ledger_dvp_cpro_route#L-hanoi-truck-ban-2026의
      "2톤 이상 주간금지" 규정과 방향은 일치하나 숫자 표기가 정확히 겹치지 않음
      (2.5 vs 2 vs 1.5), 재조사 없이 동일 규정으로 단정 금지.
    related:
      - {type: compares-to, ref: "ledger_dvp_cpro_route#L-hanoi-truck-ban-2026"}

  - id: L-hyundai-porter-h150
    kind: literature
    t: 2026-07-17
    by: CC
    status: relevant
    source:
      title: "Hyundai Porter H150 (1.5톤급, TC Motor 베트남 조립) 스펙"
      authors: "Hyundai 딜러 공식 스펙 페이지"
      year: 2026
      venue: "hyundainamphat.com.vn / hyundai-bacviet.vn / xetaisaigon.com"
      url: "https://hyundainamphat.com.vn/xe-tai-hyundai-porter-h150-thung-kin-1-5-tan-thanh-cong"
    claim: >-
      적재중량 1,500kg(총중량 3,500kg). 밀폐 적재함 내부치수 3,130×1,630×
      1,400~1,770mm(≈7~8㎥). 전체차량 5,240×1,760×2,650mm. 연비 만재 시
      12L/100km, 도로상태에 따라 8~9L/100km.
    relevance: >-
      후보 최저 차급(1.5톤) 대표값. 2톤 미만이라 도심 통행 제약 사실상 없음
      (F-truck-route-implication ①에 해당).
    related:
