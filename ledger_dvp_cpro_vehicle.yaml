  - id: F-cpro-demand-vs-dvp-supply-gap
    kind: finding
    t: 2026-07-17
    by: CC
    status: active
    claim: >-
      CPRO 월평균 총생산(17,607유닛, L-cpro-total-production-2025) ×
      유닛당 DC부품 평균(6.67개, F-dc-parts-per-unit-avg) = **수요측 추정
      117,382 EA/월**. 이는 DVP 실측 공급량(29,893 EA/월, L-dvp-part-unit-weights)
      의 **약 3.93배** — 즉 "ABC 외 다른 모델도 ABC와 크게 다르지 않다"는
      가정(사용자 제시) 하에서는 CPRO의 이론적 DVP부품 수요가 DVP의 실제
      생산량보다 4배 가까이 크게 나온다. 이 격차의 가능한 원인(확정 못함,
      전부 가설) — ① CPRO의 404개 품번 중 실제로 DVP산 다이캐스팅 부품을
      쓰는 비중이 낮을 수 있음(일부는 사출·타 공법 하우징 사용, VD7/BT5/
      NVD1이 오히려 DC부품 비중이 높은 축에 속할 가능성). ② CPRO가 DVP
      외 타 다이캐스팅 공급사도 병행 사용할 가능성(DVP가 CPRO의 유일한
      다이캐스팅 공급사라는 전제 자체가 흔들림 — O-dvp-cargo-unit-spec 및
      F-dvp-shipment-mass-modest(폐기됨)의 "DVP생산량=CPRO출하량" 전제와
      같은 계열의 미검증). ③ 이 프로젝트 전반에서 반복 확인된 "자재(MRP)가
      처리율 병목"이라는 패턴([[cell-rl-material-bottleneck]] 계열 발견과
      동일 계열) — 재고 완충으로 DVP 생산 시점과 CPRO 소비 시점이 어긋나
      단순 월별 비교가 왜곡됐을 가능성.
    basis: >-
      L-cpro-total-production-2025 × F-dc-parts-per-unit-avg ×
      L-dvp-part-unit-weights(기존 확정 DVP 월평균 29,893 EA) 산술 대조.
    related:
