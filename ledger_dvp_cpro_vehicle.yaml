    gap: "Isuzu FVR/FVM 정량 연비 수치 미확보."

  - id: F-vehicle-candidate-spectrum
    kind: finding
    t: 2026-07-17
    by: CC
    status: superseded
    claim: >-
      DVP→CPRO 셔틀(49km 편도) 차급 후보는 1.5톤(Hyundai Porter H150)부터
      15톤(Hino 500 FL/FM)까지 스펙트럼이 존재하며, 대표 지점 6개로 압축됨 —
      1.5t(적재함 ~7~8㎥, 연비 8~12L/100km) / 3.5t(밀폐 기준 적재함 ~15㎥,
      연비 10~12L/100km) / 5t(적재 4.95t, 연비 데이터 gap) / 7t(적재함 ~24㎥,
      연비 14~15L/100km) / 8t(박스형 스펙 gap, 참고로 덤프형 적재함 6.5㎥) /
      15t(적재함 ~47㎥, 연비 10~13L/100km). 시장구도는 로컬(Thaco)=저가~중가
      다수 차급 커버, 일본계(Hino/Isuzu)=법인 물류 TCO 우위 세그먼트. 2톤 미만
      차급(1.5t)만 하노이 도심 통행 제약에서 사실상 자유롭고 나머지는
      ledger_dvp_cpro_route#F-truck-route-implication의 등급별 제약을 그대로
      적용받음.
    basis: >-
      L-vn-truck-market-tiers × L-hyundai-porter-h150 × L-thaco-3p5t-7t-classes ×
      L-hino-300-series × L-8ton-dump-gap × L-hino500-isuzu-fseries-15t. 전부
      2026-07-17 딜러 스펙 페이지 웹조사 기반 — 3표 교차검증(deep-research
      파이프라인) 미실시, CC 단독 조사(review 모드, 사람 확인 전).
    related:
      - {type: based-on, ref: L-vn-truck-market-tiers}
      - {type: based-on, ref: L-hyundai-porter-h150}
      - {type: based-on, ref: L-thaco-3p5t-7t-classes}
      - {type: based-on, ref: L-hino-300-series}
      - {type: based-on, ref: L-8ton-dump-gap}
      - {type: based-on, ref: L-hino500-isuzu-fseries-15t}
      - {type: depends-on, ref: "ledger_dvp_cpro_route#F-truck-route-implication"}
      - {type: raises, ref: O-dvp-cargo-unit-spec}
      - {type: raises, ref: O-8ton-box-spec}

  - id: O-dvp-cargo-unit-spec
    kind: open
    t: 2026-07-17
    by: CC
    status: answered
    question: >-
      DVP→CPRO 실제 적재물(다이캐스팅 알루미늄 하우징 케이스, 회의록
      clean_133033.md 09:11/09:46 근거)의 개당 중량·포장(유닛박스/카톤박스/
      파레트) 규격이 내부자료(회의록 4건·CPRO_QA.md·MCF/PCF xlsx 전체·견적서
      PDF) 어디에도 없음. F-vehicle-candidate-spectrum의 차급별 적재중량·
      적재함 부피만으로는 "차량당 몇 개 실리는지"를 계산할 수 없음 — 이
      값(개당 중량/부피 또는 박스당 수량)이 확보돼야 후속 산정(이동빈도·
      차량대수 최적화) 가능. KETI-83 최종 산정은 차급 후보만으론 완결 불가.
    related:
      - {type: depends-on, ref: F-vehicle-candidate-spectrum}
      - {type: compares-to, ref: "ledger_carbon_emission#O-shuttle-empty-run"}

