    claim: >-
      3개 모델 작업표준서 BOM 시트에 완제품(조립 완료 카메라) 포장 치수가
      실측 기재돼 있음 — VD7(Mini Dome류): 유닛박스 129×129×118mm(≈1.96L).
      BT5(PT72/80·PI68/68T류, 터렛/PTZ 폼팩터): 유닛박스 315×140×125mm
      (≈5.51L), 카톤박스 745×325×280mm(10EA입). NVD1(VD1류): 유닛박스
      160×160×158mm(≈4.05L), 카톤박스 510×343×185mm(6EA입, 비율 0.166로 역산).
      단, DC UPPER/FRONT/BOTTOM/REAR CASE 등 다이캐스팅 부품 자체의 개별
      치수(가공 전 원부품 단품 치수)는 이 BOM 시트에 없음 — BOM규격란에는
      재질·색상 코드만 있고 치수는 없음(예: 'DC UPPER CASE-MINI DOME-SBWH-UDP향'
      → '(CP15DCT014-C) ALDC-12 AB#2000 0103(SBWH)').
    relevance: >-
      DVP가 공급하는 다이캐스팅 케이스는 조립 후 이 완제품 폼팩터의 외피가
      되므로, 완제품 유닛박스 크기가 "부품 하나가 최대 이 정도 부피를 넘지
      않는다"는 상한 참고치로 쓸 수 있음(단품은 내부 부품·패딩이 없어 실제로는
      더 작을 가능성 높음 — 보수적 상한으로만 사용).
    caveat: >-
      완제품 패키지(하우징+PCB+렌즈+케이블+폼패딩 등 전부 포함)이지 다이캐스팅
      부품 단품 치수가 아님 — 실제 원부품(가공 전 벌크 상태)은 이보다 작고,
      또한 낱개 소매포장이 아니라 산업용 벌크 포장(트레이 적층 등)으로 운송될
      가능성이 높아 실제 밀도는 이 추정보다 조밀(부피는 작음)할 수 있음. 82개
      DVP 품번 중 이 3개 모델과 정확히 매칭되는 품번은 일부만 확인(예:
