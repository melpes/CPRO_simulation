  - id: F-representative-fuel-final
    kind: finding
    t: 2026-07-17
    by: CC
    status: active
    claim: >-
      F-fuel-source-reconciliation을 반영한 최종 재구성 — EcoTransIT
      곡선의 "형태"(공차/60%적재/만재 간 비율, 물리적으로 그럴듯한 하중-연비
      관계)는 유지하되, 절대수준은 베트남 업계실무 정메(L-dinh-muc-fuel-benchmark)
      값에 맞춰 rescale(만재점을 정메값에 고정). 최종 대표 연비(공차/60%/
      만재, L/100km): 1.5t 7.4/8.0/**8.5** · 3.5t 9.3/10.3/**11.0** ·
      5t 9.5/10.7/**11.5**(3.5t·7~8t 사이 보간) · 7t 9.1/10.9/**12.0** ·
      8t 9.1/10.9/**12.0**(7t와 동일 정메 구간) · 15t 20.5/26.0/**30.0**.
      1.5t~8t는 rescale비율 0.47~0.55(EcoTransIT 원값의 절반 수준으로
      대폭 하향), 15t는 0.93(EcoTransIT와 이미 근접해 소폭만 조정).
    basis: >-
      F-fuel-source-reconciliation의 패턴 인식 × EcoTransIT 밴드 형태
      (공차:60%:만재 비율) × 정메 만재 anchor값 — 산술 rescale
      (각 차급 EcoTransIT값 × 정메값/EcoTransIT만재값).
    related:
