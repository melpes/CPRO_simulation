  - id: F-scenario-oversizing-penalty-v3
    kind: finding
    t: 2026-07-17
    by: CC
    status: active
    claim: >-
      최종 재구성판 — "큰 차량(15t) 50%적재"(69.0kgCO2e/trip) vs "중간
      차량(7t) 100%적재"(33.0kgCO2e/trip) — 전자가 **+109.1%**(약 2배)
      많음. v2(GVW밴드 원값끼리 비교, -0.4% 무승부)에서 큰 폭으로 재역전
      — v2는 7t를 EcoTransIT 밴드로 과대추정(실제보다 2배 이상 비효율적으로
      가정)해서 우연히 15t@50%와 비슷해진 인공물이었음. 정메로 절대수준을
      바로잡으면 "오버사이징은 확실히 손해"라는 원래(v1) 방향의 결론이
      되살아나되 그 폭은 v1(+8.6%)보다 훨씬 큼(+109%). **세 번의 시도에서
      -0.4%~+109%까지 결론이 흔들렸다는 사실 자체가, 이 비교가 현재
      데이터로는 확정할 수 없는 질문임을 보여줌**(O-no-genuine-measured-fuel-data).
    basis: >-
      F-representative-fuel-final의 15t(50%적재=25.09L/100km급) vs
      7t(100%적재=12.0L/100km) rescale값 × 동일거리 가정.
