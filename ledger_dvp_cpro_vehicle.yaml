      url: "https://modoo.macarong.net/v4/vehicles/%EC%9E%90%EB%8F%99%EC%B0%A8?brandName=%ED%98%84%EB%8C%80&modelName=%ED%8F%AC%ED%84%B02"
    claim: >-
      1t(포터2/봉고3): 공인연비 6.0~9.9km/L(트림별, 산업통상자원부 고시
      2023-157호 기준 총중량 3.5톤 미만 대상 — 이번 조사 전체에서 유일한
      정부 공인 수치). 2.5t(마이티): 7~9km/L. 5t(메가트럭/노부스):
      5~7km/L, 실지입기사 데이터로 좁히면 메가트럭 평균 6.2km/L·노부스
      5.8~6.5km/L. 11t(파비스/프리마): 4~5km/L. 25t(엑시언트):
      3~4km/L, 실운행 고속도로 3.8~4.2km/L·시내/산간 3~3.5km/L. 톤급이
      커질수록 예외 없이 연비가 나빠지는 단조 패턴 — 이전 베트남 3자료
      대조에서 겪은 모순(작은 차급이 오히려 큰 차급보다 낮은 연비로
