  - id: F-cpro-voltage-tier-estimate-v3
    kind: finding
    t: 2026-07-17
    by: CC
    status: superseded
    claim: >-
      CPRO 본공장 kV 요금세 추정(3차 강화, 여전히 확정 아님) — 공식 사업자등록
      주소(L-cpro-company-registration)로 CPRO가 "Cụm công nghiệp đa nghề Đông
      Thọ" 산업클러스터 내부에 있음이 확인됐고, 이 클러스터의 표준 전력 인프라가
      110kV 변전소발 22kV 중압 배전망으로 서술됨(L-dongtho-cluster-22kv-infra).
      여기에 기존 근거 — 설비 정격용량 268kW가 EVNNPC 저압망 재평가 문턱값
      40kW의 6배 이상(L-evnnpc-40kw-threshold)이라는 점, 건물이 CPRO 전용이라
      "임대 세입자 LV 공동분전" 시나리오가 배제된다는 점(F-cpro-building-not-
      shared-tenant) — 을 모두 합치면, CPRO가 산업클러스터의 22kV 배전망에서
      직접 자체 변압기로 수전하고 있을 가능성이 3개의 독립적 근거 축(클러스터
      인프라 규격 / 규제 문턱값 / 설비 규모)에서 수렴적으로 뒷받침됨. 이 경우
      EVN 요금표(L-tariff-1279-current) 기준 "22kV~110kV 미만" 구간(계량점이
      클러스터 배전망 22kV 지점이라면) 또는 "6kV~22kV 미만" 구간(중간 강압
      단계가 있다면)에 해당할 가능성이 높음. 다만 여전히 CPRO 개별 계약서·
      고지서 원문을 확인한 것은 아니며, 클러스터 내 소규모 입주사가 저압으로
      계량되는 경우도 배제 못 해 "6kV 미만" 가능성이 0은 아님 — 최종 확정은
      실제 hóa đơn tiền điện/hợp đồng mua bán điện의 "Cấp điện áp" 확인만 가능.
    basis: >-
      L-cpro-company-registration(등록 주소=Cụm công nghiệp đa nghề Đông Thọ) ×
      L-dongtho-cluster-22kv-infra(클러스터 표준 인프라=22kV) ×
