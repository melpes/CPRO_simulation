  - id: D-scope-tou-diff-only
    kind: decision
    t: 2026-07-15
    by: user
    status: active
    decision: >-
      전기비 분석은 시간대별 차등 요율만 반영한다. 시간대 무관 항목 —
      균일 비율 가산 세금(VAT), 이부요금제 기본요금 — 은 범위 제외.
      요율은 2026-07-15 현행(결정 1279/QĐ-BCT 요율 × 결정 963/QĐ-BCT 시간대)으로
      고정해 사용하고, 향후 개정 추정은 지금은 무시한다.
    reason: >-
      시간대 선택·생산성 분석에는 시간대 간 상대 차이만 유효 — 모든 시간대에
      동일하게 부과되는 항목은 결론을 바꾸지 않는다. 개정 시점·폭은 근거 있는
      추정만 가능하므로 특정 시점 고정이 실용적 (docx 댓글 #0~#2, 2026-07-15).
    scope: "베트남 현지 전기비 조사 및 후속 시뮬레이션 비용 산정"
    related:
      - {type: answers, ref: O-vat-rate}
      - {type: answers, ref: O-two-part-pilot}
      - {type: answers, ref: O-next-revision}
      - {type: based-on, ref: L-tariff-1279-current}
      - {type: based-on, ref: L-tou-963-timebands}

  - id: F-cpro-monthly-kwh-2024
    kind: finding
    t: 2026-07-17
    by: CC
    status: active
    claim: >-
      CPRO 조립공정(SMT) 본공장의 2024년 월별 전력 사용량 실측치를 원본자료에서 확인함
      (출처: (CPRO) MCF 데이터 검토_SMT 통합본_260401_송부용.xlsx, 시트 Rawdata_INPUT
      R11행, 데이터출처='고지서(폐수처리장포함)' — 실제 전기 고지서 기반, 폐수처리장
      포함 전체 생산공정 집계). 2024.01~12월 kWh: 1월 70,802 / 2월 71,680 / 3월 80,240 /
      4월 49,463 / 5월 60,495 / 6월 69,668 / 7월 73,159 / 8월 79,048 / 9월 67,093 /
      10월 66,888 / 11월 57,480 / 12월 46,997. 연간 합계 793,013 kWh(월평균 약 66,084 kWh,
      최대 3월 80,240 / 최소 12월 46,997). 같은 파일 '생산설비목록' 시트의 설비별
      정격용량(kW)×개수 합산치는 약 268.0kW(역률 0.98 적용 기준, 비가동 유휴설비 1대
      제외)이고, 시트 하단 합계행(spec 기준 O52=889,970.88 kWh, 할당 Q52=793,013 kWh)이
      Rawdata_INPUT 연간 합계와 정합됨(자료 내부 교차검증, 외부 3표 검증 아님).
    basis: >-
      C:\Users\KangTaehui\KG\keti\CPRO_조립공정\원본자료\에코앤파트너스\(CPRO) MCF
      데이터 검토_SMT 통합본_260401_송부용.xlsx — 시트 'Rawdata_INPUT'(R11) 및
      '생산설비목록'(전체 행, M열 정격kW×H열 개수 합산, O52/Q52 합계행).
    related:
      - {type: raises, ref: O-cpro-voltage-tier-unconfirmed}

