  - id: L-evnnpc-40kw-threshold
    kind: literature
    t: 2026-07-17
    by: CC
    status: refuted
    source:
      title: >-
        전력공급 영업규정 제19조 — 등록용량 40kW 이상 신청 고객의 저압망 부하
        재평가 (Tổng Công ty Điện lực Miền Bắc/EVNNPC 영업규정 인용)
      authors: "Tổng Công ty Điện lực Miền Bắc(EVNNPC) 전력사업 영업규정 제19조 (2차 인용)"
      year: 2026
      venue: "vietmysteel.com 트램비엔압(변압기) 설치 견적 안내 페이지"
      url: "https://vietmysteel.com/bao-gia-lap-dat-tram-bien-ap/"
    claim: >-
      "Khách hàng đề nghị mua điện với công suất đăng ký từ 40kW trở lên, tùy
      theo khả năng cung cấp của lưới điện hạ áp hiện hữu" — 고객이 등록용량
      40kW 이상을 신청하면 기존 저압망 공급 여력에 따라 전력회사가 재평가하며,
      저압망에 부담이 되면 고객이 자비로 자체 변압기를 지어 중압(통상 22kV)으로
      승압 접속하는 절차를 밟게 됨. Tổng Công ty Điện lực Miền Bắc(EVNNPC, 박닌성
      포함 북부 전역 관할)의 전력사업 영업규정 제19조를 인용해 서술.
    relevance: >-
      Bắc Ninh(옌퐁)은 EVNNPC 관할 지역이라 이 규정이 CPRO 본공장에도 원칙적으로
      적용됨. CPRO 설비 정격용량 합계(약 268kW, F-cpro-monthly-kwh-2024)는 이
      40kW 문턱값의 6배 이상 — 저압망만으로 공급하기엔 규정상 재평가·자체 변압기
      전환 검토 대상 규모.
    caveat: >-
      1차 출처(EVNNPC 원문 규정집)를 직접 확인한 게 아니라 설치업체 블로그의 인용
      — 단일 소스, 3표 교차검증 미실시. 문구가 EVNNPC 원문과 정확히 일치하는지는
      미확인. "40kW 초과 = 반드시 자체 변압기 강제"가 아니라 "재평가 대상"이라는
      점에 유의(저압망 여력이 충분하면 저압 유지도 이론상 가능).
      [2026-07-17 정정] EVN그룹 공식 영업규정 1차 원문(EVNSPC 적용본 PDF) 직접
      대조 결과 이 claim은 근거 부족으로 판정됨 — 상세는 DE-evnnpc-dieu19-claim-
      unsubstantiated·L-evn-group-qtkddn-primary 참고. "제19조"라는 조항 번호부터
      원문과 불일치(원문 제19조=계약해지, 40kW·변압기와 무관).
    related:
      - {type: supports, ref: F-cpro-voltage-tier-estimate-v2}

