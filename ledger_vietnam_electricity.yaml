    what: >-
      L-evnnpc-40kw-threshold(vietmysteel.com 인용)가 주장한 경로 — "EVNNPC
      전력사업 영업규정 제19조가 등록용량 40kW 이상 고객의 저압망 재평가·자체
      변압기(22kV) 전환을 규정한다"는 claim을 그대로 근거 축으로 채택해
      F-cpro-voltage-tier-estimate-v2/v3에 사용한 것.
    reason: >-
      EVN그룹 공식 "전력사업 영업규정"(Quy trình Kinh doanh Điện năng) 1차 원문
      PDF(EVNSPC 적용본, pcangiang.evnspc.vn 공식 게재, 444페이지 — 직접 다운로드
      후 전문 검색)를 대조한 결과 불일치가 드러남: ① 원문의 제19조(Điều 19,
      Phần III)는 "Chấm dứt HĐMBĐ"(전력매매계약 해지)로, 40kW·변압기와 무관.
      ② 40kW는 실제로 제9조(하압 신규공급)·제10조(중압 신규공급)·제12조
      (용량변경)에 공통으로 등장하지만, 전부 "생산·서비스업 고객, 등록용량
      40kW 이상이면 부하곡선(biểu đồ phụ tải) 등록 서류 필요"라는 서류요건일
      뿐이었음. ③ 결정적으로 제9조(하압 신규공급) 자체의 신청서류 목록에
      "공급용량 40kW 이상 고객의 부하곡선 등록"이 포함돼 있음 — 즉 40kW를
      넘어도 하압(LV) 신규공급 신청 자체가 막히지 않음. "저압망 재평가·자체
      변압기 강제 전환"을 명시한 조항은 문서 전체에서 발견되지 않음(4개
      페이지에서 "40kW" 검색 매치 전수 확인).
    revive_if: >-
      EVNNPC(북부전력공사) 자체의 최신 버전 원문(EVNSPC가 아닌 관할청 원문)을
      직접 확인해 다른 조항 번호·다른 문구로 동일 취지 규정이 실재함이
      확인될 경우. 또는 CPRO가 실제로 제10조(중압 신규공급) 경로로 접속했다는
      직접 증거(계약서·고지서)가 나올 경우.
    related:
      - {type: contradicts, ref: L-evnnpc-40kw-threshold}

  - id: L-evn-group-qtkddn-primary
    kind: literature
    t: 2026-07-17
    by: CC
    status: relevant
    source:
      title: "전력사업 영업규정(Quy trình Kinh doanh Điện năng) — EVN그룹 공통틀,
        EVNSPC(남부전력공사) 적용본 원문 (Quyết định 1050/QĐ-EVN 계열)"
      authors: "Tập đoàn Điện lực Việt Nam(EVN)/Tổng Công ty Điện lực Miền Nam(EVNSPC)"
      year: 2026
      venue: "pcangiang.evnspc.vn (EVNSPC An Giang 지사 공식 게재 PDF, 444페이지)"
      url: "https://pcangiang.evnspc.vn/Areas/EC_Website/Attachments/Article/files/Quy%20trinh%20Kinh%20doanh%20dien%20nang%20ap%20dung%20trong%20EVNSPC.pdf"
    claim: >-
      40kW는 제9조(Cấp điện mới hạ áp, 하압 신규공급)·제10조(Cấp điện mới trung
      áp, 중압 신규공급)·제12조(Thay đổi công suất sử dụng điện, 용량변경) 세
      절차 모두에서 공통 서류요건으로 등장 — "생산·서비스업 고객으로서 등록
      용량 40kW 이상이면 부하곡선(biểu đồ phụ tải) 등록 필요". 제9조(하압 신규
      공급) 자체가 40kW 이상 고객에게도 명시적으로 적용 가능하도록 서술돼
      있어, 40kW 초과가 하압 공급을 자동으로 막거나 중압 전환을 강제하지
      않음. 별도로 고객 의무 섹션(p.37)에는 "등록용량은 40kW 미만이나 실사용
      최대전력이 3회 연속 검침에서 40kW 이상이면 무효전력(công suất phản
      kháng) 구매 의무" 조항도 존재 — 역률관리 의무의 문턱으로도 40kW가 별도로
      쓰임(저압망 재평가와는 무관한 별개 조항).
    relevance: >-
      L-evnnpc-40kw-threshold(vietmysteel.com 2차 인용)의 핵심 주장을 1차 원문
      대조로 반박(DE-evnnpc-dieu19-claim-unsubstantiated). 40kW라는 숫자 자체는
      EVN 공식 문서에 실재하지만 의미가 다름 — "저압 공급이 막히는 문턱"이
      아니라 "부하곡선 등록·역률관리 의무가 생기는 행정 문턱"임. CPRO가 22kV로
      수전하는지는 이제 "고객이 경제성 판단에 따라 제10조(중압 신규공급)를
      자발적으로 신청했는지" 여부에 달린 문제로 재정의됨 — 규제가 강제하는
      게 아님.
    caveat: >-
      확인한 문서는 EVNSPC(남부전력공사) 적용본이며 Bắc Ninh 관할 EVNNPC(북부
      전력공사) 버전 원문은 아직 직접 확인 못함. 다만 두 문서 모두 EVN그룹
      공통틀(Quyết định 1050/QĐ-EVN 계열)을 따르므로 조 구조·문구가 유사할
      가능성이 높음(제목 차례 확인 결과 챕터·조 번호 체계가 일반적인 EVN
      템플릿과 일치). EVNNPC 고유본과 100% 동일하다고 단정할 수는 없음.
    related:
      - {type: contradicts, ref: L-evnnpc-40kw-threshold}
      - {type: based-on, ref: DE-evnnpc-dieu19-claim-unsubstantiated}

  - id: F-cpro-voltage-tier-estimate-v4
    kind: finding
    t: 2026-07-17
    by: CC
    status: active
    claim: >-
      CPRO 본공장 kV 요금세 추정(4차 정정, 신뢰도 v3보다 하향). 이전 추정(v3)의
      3개 근거 축 중 "규제 문턱값"(EVNNPC 40kW 초과 시 저압망 재평가·자체
      변압기 강제 전환) 축이 1차 원문 대조 결과 근거 부족으로 무효화됨
      (DE-evnnpc-dieu19-claim-unsubstantiated, L-evn-group-qtkddn-primary) —
      실제로는 40kW가 "부하곡선 등록 의무" 행정 문턱일 뿐, 하압 공급 자체를
      막거나 중압 전환을 강제하지 않음. 남은 두 근거 축은 유효: ① CPRO의
      공식 등록 주소(L-cpro-company-registration)가 "Cụm công nghiệp đa nghề
      Đông Thọ" 산업클러스터이고 이 클러스터의 표준 전력 인프라가 22kV 중압
      배전망으로 서술됨(L-dongtho-cluster-22kv-infra), ② 건물이 CPRO 전용이라
      "임대 세입자 LV 공동분전" 반대 시나리오가 배제됨(F-cpro-building-not-
      shared-tenant). 다만 규제적 강제 근거가 빠지면서, 22kV 수전 여부는 이제
      "CPRO가 경제성 판단에 따라 제10조(중압 신규공급)를 자발적으로 신청했는가"
      라는, 검증 안 된 고객 선택의 문제로 재정의됨 — 대형 제조 공장이 산업
      클러스터 내에서 자체 변압기를 자발적으로 신청하는 사례가 흔하다는 것은
      정성적 정황(kth-electric.com: "22kV 중압 구매 시 저압 대비 요금 저렴")
      일 뿐, CPRO가 실제로 그렇게 했다는 직접 증거는 아님. 종합 신뢰도: 2개
      정황 축 수렴(산업단지 인프라 규격 + 건물 전용) — "가능성 있음" 수준이며
      v3의 "가능성 높음"보다 한 단계 낮춤.
      [구간 매핑 정정] L-tariff-1279-current의 구간 경계는 "22kV~110kV 미만"
      =22kV 이상~110kV 미만(22kV 포함), "6kV~22kV 미만"=6kV 이상~22kV 미만
      (22kV 미포함)으로 이미 검증돼 있음. 즉 CPRO가 실제로 클러스터 22kV
      배전망에서 자체 변압기로 직접 구매("mua điện ở cấp trung thế 22kV qua
      trạm biến áp riêng")한다면 그 자체로 "22kV~110kV 미만" 구간에 해당 —
      "6kV~22kV 미만" 구간은 여기 해당하지 않음(그 구간은 6~21kV대 중간전압
      수전에 해당하는데, 클러스터 표준 인프라가 명시적으로 22kV이므로 이
      시나리오와는 안 맞음). 따라서 실질적으로 남는 것은 이분법 — ① CPRO가
      자체 변압기로 22kV 지점에서 직접 계약·계량한다면 "22kV~110kV 미만"
      구간(요금표 전체 4구간 중 두 번째로 저렴), ② 반대로 산업클러스터나
      건물 측이 소유한 변압기의 2차측(저압)에서 CPRO가 계량된다면 "6kV 미만"
      구간(가장 비쌈) — 둘 중 어느 쪽인지는 CPRO의 실제 전력공급계약서 없이는
      확정 불가. 두 시나리오 중 어느 쪽이 더 개연성 있는지는 이 ledger의
      다른 근거(산업클러스터 인프라·건물 전용)로도 가리지 못함 — 계약 주체
      (CPRO 자신이 변압기를 발주했는지, 클러스터 투자사가 공용 변압기를
      깔아준 것인지)를 알아야 함.
    basis: >-
