entries:
  - id: L-tariff-1279-current
    kind: literature
    t: 2026-07-15
    by: CC
    status: relevant
    source:
      title: "Quyết định 1279/QĐ-BCT — 전기판매가격 결정 (2025-05-09 발령, 2025-05-10 시행)"
      authors: "베트남 산업통상부(MOIT)"
      year: 2025
      venue: "MOIT 결정문 (EVN 공식 요금표 게시 + 법령 DB thuvienphapluat)"
      url: "https://thuvienphapluat.vn/van-ban/Thuong-mai/Quyet-dinh-1279-QD-BCT-2025-gia-ban-dien-656047.aspx"
    claim: >-
      현행 제조업(산업용) 시간대별 소매전기요금(VAT 제외, VND/kWh) —
      110kV 이상: 보통 1,811 / 심야 1,146 / 피크 3,266.
      22kV~110kV 미만: 보통 1,833 / 심야 1,190 / 피크 3,398.
      6kV~22kV 미만: 보통 1,899 / 심야 1,234 / 피크 3,508.
      6kV 미만: 보통 1,987 / 심야 1,300 / 피크 3,640.
      평균 소매요금 2,204.0655 VND/kWh (직전 대비 +4.8%, EVN 결정 599/QĐ-EVN 병행).
      2026-07-15 현재 최신 요금 결정 — 이후 요율 인상 없음.
    relevance: >-
      베트남 현지 공장 전기비 산정의 현행 단가표. 시뮬레이션 에너지 비용(kWh당)을
      현지 통화로 환산할 때 이 표를 기준으로 쓴다. 전압이 낮을수록 단가가 높음에 유의.
    takeaway: >-
      deep-research 3표 검증에서 관련 클레임 8건 전부 3-0 만장일치. EVN 베트남어/영어
      공식 페이지·EVN Hanoi PDF·법령 DB 2곳 등 4개 독립 계열 출처에서 12개 수치 전부 일치,
      직전 요금표 ×1.048 산술 교차검증 통과.
      [2026-07-17 재확인] 구간 경계(22kV·6kV가 어느 쪽에 포함되는지)를 Bộ Công Thương
      (MOIT) 공식 원본 스캔본으로 직접 육안 확인함(moit.gov.vn/upload/2005517/fck/
      files/QD1279-QD-BCT_7917a.pdf, 부록 "GIÁ BÁN ĐIỆN" p.3). 원문 표기 그대로:
      "1.2 Cấp điện áp từ 22 kV đến dưới 110 kV"(22kV **포함**~110kV 미만),
      "1.3 Cấp điện áp từ 6 kV đến dưới 22 kV"(6kV 포함~22kV **미포함**). 즉 정확히
      22kV는 1.2 구간(22kV~110kV 미만)에 해당하고 1.3에는 해당하지 않음 — 경계
      포함/제외 방향을 원본 문구로 확정.
    caveat: >-
      모든 요율은 VAT 제외 — 실효 부담액은 VAT 가산 필요(적용 VAT율은 미검증, O-vat-rate).
      월 20만 kWh 이상 대용량 수용가는 이부요금제 시범 대상일 수 있음(O-two-part-pilot).
    related:
      - {type: supersedes, ref: L-tariff-2699-prev}
      - {type: raises, ref: O-vat-rate}
      - {type: raises, ref: O-two-part-pilot}

  - id: L-tou-963-timebands
    kind: literature
    t: 2026-07-15
    by: CC
    status: relevant
    source:
      title: "Quyết định 963/QĐ-BCT — 국가전력계통 피크/보통/심야 시간대 규정 (2026-04-22 발령=시행)"
      authors: "베트남 산업통상부(MOIT)"
      year: 2026
      venue: "정부 정책포털 xaydungchinhsach.chinhphu.vn 및 EVN 공식 보도"
      url: "https://xaydungchinhsach.chinhphu.vn/quy-dinh-moi-ve-gio-cao-diem-thap-diem-cua-he-thong-dien-quoc-gia-119260428170109578.htm"
    claim: >-
      현행 시간대 정의(2026-04-22부터) — 피크: 월~토 17:30~22:30(일 5시간), 일요일 피크 없음.
      보통: 월~토 06:00~17:30 및 22:30~24:00(일 13시간), 일요일 06:00~24:00(18시간).
      심야: 요일 무관 매일 00:00~06:00(6시간). 종전 Thông tư 16/2014/TT-BCT 체계
      (오전 피크 09:30~11:30, 심야 22:00~04:00)는 폐지·대체.
    relevance: >-
      시간대별 전기비 계산의 시간축. 현행 계산은 반드시 "1279/QĐ-BCT 요율 × 963/QĐ-BCT
      시간대" 조합으로 해야 한다. 2026-04-22 이전 자료의 시간대를 현행으로 인용하면 오류.
    takeaway: >-
      3-0 만장일치 검증. EVN 공식 사이트가 원문 그대로 확인("일요일: 피크 없음" 포함),
      정부 정책포털·법령 DB 2곳·전력청 교차 확인. 오전 피크가 사라져 주간 근무 위주
      공장의 피크 노출이 저녁 시프트에 집중됨.
    related:
      - {type: supersedes, ref: DE-old-tou-16-2014}

  - id: L-tariff-2699-prev
    kind: literature
    t: 2026-07-15
    by: CC
    status: superseded-by-newer
    source:
      title: "Quyết định 2699/QĐ-BCT — 전기판매가격 결정 (2024-10-11 시행, 과거 요율)"
      authors: "베트남 산업통상부(MOIT)"
      year: 2024
      venue: "MOIT 결정문 (법령 DB thuvienphapluat + EVN 영문 보도)"
      url: "https://thuvienphapluat.vn/van-ban/Thuong-mai/Quyet-dinh-2699-QD-BCT-2024-gia-ban-dien-627181.aspx"
    claim: >-
      2024-10-11~2025-05-09 적용 제조업 요금(보통/심야/피크, VND/kWh) —
      110kV 이상 1,728/1,094/3,116. 22~110kV 1,749/1,136/3,242.
      6~22kV 1,812/1,178/3,348. 6kV 미만 1,896/1,241/3,474.
      평균 2,103.1159 VND/kWh(+4.8%, EVN 결정 1046/QĐ-EVN 병행).
    relevance: >-
      개정 이력 파악용 과거 요율. 2024~2026 사이 +4.8% 두 차례(2024-10, 2025-05) 인상
      패턴의 앞 단계. 과거 기간 소급 계산이나 인상 추세 추정에 사용.
    takeaway: >-
      관련 클레임 6건 전부 3-0 검증. 2026년에는 요율 인상 없이 제도 변경만
      (시간대 재정의 963/QĐ-BCT, 요금조정 메커니즘 시행령 278/2026/NĐ-CP) — 이 부분은
      medium 신뢰(독립 3표 검증 미통과, 검증자 부수 증거 기반).
    related:
      - {type: raises, ref: O-next-revision}

  - id: L-fx-vnd-2026-07
    kind: literature
    t: 2026-07-15
    by: CC
    status: tangential
    source:
      title: "USD/VND·VND/KRW 시장환율 조회 (2026-07 시점)"
      authors: "?"
      year: 2026
      venue: "tradingeconomics.com / valutafx.com / investing.com"
      url: "https://tradingeconomics.com/vietnam/currency"
    claim: >-
      2026-07-15 기준 USD/VND 약 26,260 (tradingeconomics), 2026-07-08 기준
      1,000 VND ≈ 57.3 KRW (valutafx). 환산 예: 6kV 미만 피크 3,640 VND/kWh ≈
      0.14 USD ≈ 190 KRW, 110kV 이상 심야 1,146 VND/kWh ≈ 0.044 USD ≈ 60 KRW.
    relevance: >-
      요금표를 원화/달러로 병기할 때의 참고 계수. 보고서에는 "조회 시점 환율" 명시 필수.
    caveat: >-
      환율 수치는 deep-research 검증 파이프라인의 3표 검증을 거치지 않은 참고치.
      VND는 2024~2026 대미 약세 진행(약 24,500→26,000+)으로 시점 민감도 큼 —
      실사용 시 조회 시점 환율로 재계산.
    related:
      - {type: depends-on, ref: L-tariff-1279-current}

  - id: DE-old-tou-16-2014
    kind: dead-end
    t: 2026-07-15
    by: CC
    status: closed
    what: >-
      구 Thông tư 16/2014/TT-BCT 시간대(피크 = 월~토 09:30~11:30 + 17:00~20:00,
      심야 = 22:00~04:00)를 현행 시간대로 사용하는 경로.
    reason: >-
      2026-04-22 결정 963/QĐ-BCT로 전면 대체됨. deep-research 검증에서 구 시간대를
      현행으로 서술한 클레임 2건이 1-2로 기각 — 웹에 구 시간대 자료가 여전히 많아
      혼입 위험이 크다.
    revive_if: >-
      2026-04-22 이전 기간의 전기비를 소급 계산·비교할 때만 (그 기간엔 구 시간대가 유효).
    related:
      - {type: contradicts, ref: L-tou-963-timebands}

